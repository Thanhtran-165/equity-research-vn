# Technical Phase 2B — Archetype Verification Plan
# Verification plan for 5 archetypes from archetype-precedence-reconciliation.yaml
# Every archetype MUST have: eligibility_test_data + exclusion_test + tie_break_test + insufficient_data_test

archetype_verification_plan:
  version: "1.0.0"
  frozen_at: "2026-07-25"
  baseline:
    canonical_archetypes: 5
    precedence_order: [A-TREND-FOLLOWING, A-ACCUMULATION-BREAKOUT, A-TRAP-PRONE, A-MIXED, A-NO-CURRENT-SETUP]
    rationale_frozen_in_phase_3: true
    deterministic_tie_break: true

  verification_strategy:
    layers:
      - LAYER_1_ELIGIBILITY: "Synthetic test data crafted to make exactly ONE archetype eligible"
      - LAYER_2_EXCLUSION: "Test that higher-precedence archetype overrides lower when both eligible"
      - LAYER_3_TIE_BREAK: "Verify unique precedence means ties impossible (deterministic)"
      - LAYER_4_INSUFFICIENT_DATA: "Verify fallback behavior when data insufficient"
      - LAYER_5_LIVE_COHORT: "8-ticker genuine cohort in Phase 5 exercises real cases"

  # ====================================================================
  # Per-archetype verification cases
  # ====================================================================

  archetypes:

    # ----------------------------------------------------------------
    # A-TREND-FOLLOWING (precedence 1 — highest)
    # ----------------------------------------------------------------

    - archetype_id: A-TREND-FOLLOWING
      precedence: 1
      eligibility_rule: "Any CONTINUATION pattern setup with score ≥55"

      test_cases:

        - case_id: TC-ATF-ELIG-001
          layer: LAYER_1_ELIGIBILITY
          description: "Bull Continuation Flag with score 65 → A-TREND-FOLLOWING assigned"
          input_data:
            weekly_trend: "rising"
            setup_S_BULL_FLAG: {score: 65, status: CONFIRMED}
            setup_S_BULL_PENNANT: {score: 0, status: NOT_PRESENT}
            trap_prone_conditions: false
          expected_output:
            archetype: A-TREND-FOLLOWING
            rationale: "S-BULL-FLAG ≥55"
          linked_verifier: VC-CONFLICT-SETUP-1

        - case_id: TC-ATF-EXCL-001
          layer: LAYER_2_EXCLUSION
          description: "Trend Following + Trap Prone both eligible → Trend wins"
          input_data:
            setup_S_BULL_FLAG: {score: 65}
            high_volume_behavior: {label: suy yếu, positive_rate: 35, median_return: -0.5, event_count: 8}
          expected_output:
            archetype: A-TREND-FOLLOWING
            rationale: "precedence 1 > precedence 3"
          linked_verifier: VC-CONFLICT-SETUP-1

        - case_id: TC-ATF-INSUFF-001
          layer: LAYER_4_INSUFFICIENT_DATA
          description: "Trend eligible but <60 sessions → fallback to no_current_setup"
          input_data:
            daily_sessions: 55
            setup_S_BULL_FLAG: {score: 65}
          expected_output:
            archetype: A-NO-CURRENT-SETUP
            rationale: "INSUFFICIENT_HISTORY before archetype evaluation"
          linked_verifier: VC-INHIST-1

    # ----------------------------------------------------------------
    # A-ACCUMULATION-BREAKOUT (precedence 2)
    # ----------------------------------------------------------------

    - archetype_id: A-ACCUMULATION-BREAKOUT
      precedence: 2
      eligibility_rule: "Any ACCUMULATION pattern setup with score ≥55"

      test_cases:

        - case_id: TC-AAB-ELIG-001
          layer: LAYER_1_ELIGIBILITY
          description: "Cup with Handle score 70, no continuation → A-ACCUMULATION-BREAKOUT"
          input_data:
            setup_S_CUP_HANDLE: {score: 70}
            setup_S_BULL_FLAG: {score: 0}
            trap_prone_conditions: false
          expected_output:
            archetype: A-ACCUMULATION-BREAKOUT

        - case_id: TC-AAB-EXCL-001
          layer: LAYER_2_EXCLUSION
          description: "Accumulation + Trend both eligible → Trend wins"
          input_data:
            setup_S_CUP_HANDLE: {score: 70}
            setup_S_BULL_FLAG: {score: 65}
          expected_output:
            archetype: A-TREND-FOLLOWING
            rationale: "precedence 1 wins over precedence 2"

    # ----------------------------------------------------------------
    # A-TRAP-PRONE (precedence 3)
    # ----------------------------------------------------------------

    - archetype_id: A-TRAP-PRONE
      precedence: 3
      eligibility_rule: "high_volume_behavior_profile label = 'suy yếu' (positive_rate≤40% & median_return<0, min 5 events)"

      test_cases:

        - case_id: TC-ATP-ELIG-001
          layer: LAYER_1_ELIGIBILITY
          description: "HVB suy yếu + no higher archetypes → A-TRAP-PRONE"
          input_data:
            high_volume_behavior: {label: suy yếu, positive_rate: 35, median_return: -0.5, event_count: 8}
            setup_any_continuation: {score: 0}
            setup_any_accumulation: {score: 0}
          expected_output:
            archetype: A-TRAP-PRONE

        - case_id: TC-ATP-INSUFF-001
          layer: LAYER_4_INSUFFICIENT_DATA
          description: "HVB suy yếu but only 4 events → A-TRAP-PRONE NOT eligible"
          input_data:
            high_volume_behavior: {label: suy yếu, positive_rate: 35, median_return: -0.5, event_count: 4}
          expected_output:
            archetype: A-NO-CURRENT-SETUP
            rationale: "min 5 HVB events not met"
          linked_verifier: VC-ARCH-AMBIG-1

        - case_id: TC-ATP-INSUFF-002
          layer: LAYER_4_INSUFFICIENT_DATA
          description: "HVB suy yếu with 5 events but no setups → A-TRAP-PRONE (data sufficient)"
          input_data:
            high_volume_behavior: {label: suy yếu, positive_rate: 35, median_return: -0.5, event_count: 5}
            setup_any: {score: 0}
          expected_output:
            archetype: A-TRAP-PRONE

    # ----------------------------------------------------------------
    # A-MIXED (precedence 4)
    # ----------------------------------------------------------------

    - archetype_id: A-MIXED
      precedence: 4
      eligibility_rule: "Multiple conflicting setups from different families, none dominant"

      test_cases:

        - case_id: TC-AMX-ELIG-001
          layer: LAYER_1_ELIGIBILITY
          description: "Bull Flag 50 + Bear Flag (Phase 4 bearish) 50 → A-MIXED"
          input_data:
            setup_S_BULL_FLAG: {score: 50}
            setup_S_BEAR_FLAG: {score: 50}  # Phase 4 bearish
            trap_prone_conditions: false
          expected_output:
            archetype: A-MIXED
            rationale: "Conflicting signals, neither ≥55 threshold"
          note: "Bearish setups available only after Phase 4 implementation"

        - case_id: TC-AMX-EXCL-001
          layer: LAYER_2_EXCLUSION
          description: "Mixed + Trend eligible → Trend wins"
          input_data:
            setup_S_BULL_FLAG: {score: 50}
            setup_S_BEAR_FLAG: {score: 50}
            setup_S_TRIANGLE_ASC: {score: 60}
          expected_output:
            archetype: A-TREND-FOLLOWING

    # ----------------------------------------------------------------
    # A-NO-CURRENT-SETUP (precedence 5 — fallback)
    # ----------------------------------------------------------------

    - archetype_id: A-NO-CURRENT-SETUP
      precedence: 5
      eligibility_rule: "No setups with score ≥55 AND trap_prone not triggered"

      test_cases:

        - case_id: TC-ANC-ELIG-001
          layer: LAYER_1_ELIGIBILITY
          description: "Empty setups → A-NO-CURRENT-SETUP"
          input_data:
            setup_any: {score: 0}
            trap_prone_conditions: false
          expected_output:
            archetype: A-NO-CURRENT-SETUP

        - case_id: TC-ANC-DEFAULT-001
          layer: LAYER_4_INSUFFICIENT_DATA
          description: "Insufficient data to classify → A-NO-CURRENT-SETUP (default)"
          input_data:
            daily_sessions: 55
          expected_output:
            archetype: A-NO-CURRENT-SETUP
            rationale: "Default when insufficient data"
          linked_verifier: VC-ARCH-AMBIG-1

  # ====================================================================
  # Tie-break & deterministic verification
  # ====================================================================

  tie_break_verification:
    rule: "Unique precedence per archetype → ties impossible"
    deterministic: true
    test_case:
      case_id: TC-TIE-IMPOSSIBLE-001
      description: "Property test: for any input, exactly ONE archetype wins"
      property: "∀ input → archetype_output ∈ {5 archetypes}, deterministic"
      linked_verifier: VC-ARCH-AMBIG-1

  precedence_determinism_property_test:
    description: |
      For any 2 archetypes A_i and A_j where precedence(A_i) < precedence(A_j),
      if both are eligible for the same input, A_i ALWAYS wins.
      Run 1000 random synthetic inputs, assert no ambiguity.

  no_match_fallback_test:
    rule: "When no archetype eligible → A-NO-CURRENT-SETUP"
    test_case: TC-ANC-DEFAULT-001

  # ====================================================================
  # Phase 5 live cohort coverage
  # ====================================================================

  live_cohort_plan:
    tickers:
      FPT: "Expected A-TREND-FOLLOWING or A-ACCUMULATION-BREAKOUT (large-cap tech, sustained uptrend)"
      VCB: "Expected A-TREND-FOLLOWING or A-NO-CURRENT-SETUP (large-cap bank)"
      BVH: "Expected A-MIXED or A-NO-CURRENT-SETUP (insurance, lower liquidity)"
      HPG: "Expected A-ACCUMULATION-BREAKOUT or A-TRAP-PRONE (steel cyclical)"
      MWG: "Expected A-TREND-FOLLOWING (retail growth)"
      HSG: "Expected A-TRAP-PRONE (steel cyclical, bear market candidate)"
      EDGE-1: "Newly listed → A-NO-CURRENT-SETUP (insufficient history)"
      EDGE-2: "Suspended → A-NO-CURRENT-SETUP"

    coverage_target:
      all_5_archetypes_exercised: REQUIRED
      note: "If cohort doesn't naturally exercise all 5, add synthetic edge cases."

  # ====================================================================
  # Cross-artifact integrity
  # ====================================================================

  integrity_check:
    archetype_count: 5
    test_case_count: 13
    every_archetype_has_test: true
    every_archetype_has_insufficient_data_test: true
    deterministic_property_verified: true
    cross_artifact_lock: manifests/technical-phase2B-cross-artifact-lock.yaml
    status: PASS
