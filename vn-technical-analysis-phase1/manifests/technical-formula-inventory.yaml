  # === PROFILE mode formulas (17 blocks → 17 formula families) ===

  - formula_id: F-HV-PROFILE
    display_name: "Historical Volatility (HV20/60/120/252)"
    modes_used: [PROFILE]
    mathematical_definition: "HV = std_dev(log_returns, window) × √252 × 100 (annualized)"
    input_series: [daily_close]
    lookback_window: [20, 60, 120, 252]
    warmup_requirement: 252 for HV252
    output_unit: "percentage annualized"
    source_location: "SRC-007 line 130-140"
    ambiguity: "Uses √252 for daily (PROFILE) vs √52 for weekly (ACTIVE in indicators.md). Consistent with frequency but not cross-referenced."

  - formula_id: F-DD-PROFILE
    display_name: "Drawdown Series"
    modes_used: [PROFILE]
    mathematical_definition: "dd[i] = (close[i] / running_max(close[:i+1]) - 1) × 100"
    lookback_window: full_sample
    output_unit: "percentage negative"
    source_location: "SRC-007 line 180-210"
    ambiguity: "Drawdown episodes logic has potential variable assignment bug (peak_at_start scope)"

