  # === ACTIVE mode indicators (6 families) ===

  - formula_id: F-MA-ACTIVE
    display_name: "Moving Average (MA10/20/50)"
    modes_used: [ACTIVE]
    mathematical_definition: "SMA (Simple Moving Average) — indicators.md line 15: sum(period)/period. EMA variant also defined: k=2/(period+1), seed=out[0]=data[0]"
    input_series: [weekly_close]
    input_frequency: WEEKLY
    lookback_window: [10, 20, 50]
    warmup_requirement: AMBIGUOUS
    missing_data_policy: AMBIGUOUS
    zero_value_policy: AMBIGUOUS
    adjustment_policy: AMBIGUOUS (adjusted vs unadjusted not specified)
    rounding_policy: AMBIGUOUS
    output_unit: "price (nghìn đồng)"
    threshold_logic: "price > MA = bullish signal +1, price < MA = bearish signal -1"
    source_location: "SRC-001 line 100, SRC-002 line 15-30"
    ambiguity: "SKILL.md says 'trung bình động' without specifying SMA or EMA. indicators.md defines both."

  - formula_id: F-RSI-ACTIVE
    display_name: "RSI(14) Wilder Smoothing"
    modes_used: [ACTIVE]
    mathematical_definition: "Wilder smoothing: avgGain=(avgGain*(period-1)+gain)/period, RS=avgGain/avgLoss, RSI=100-100/(1+RS)"
    input_series: [weekly_close]
    input_frequency: WEEKLY
    lookback_window: 14
    warmup_requirement: AMBIGUOUS (≥14 needed but seeding method not specified)
    missing_data_policy: AMBIGUOUS
    zero_value_policy: AMBIGUOUS
    adjustment_policy: AMBIGUOUS
    rounding_policy: AMBIGUOUS
    output_unit: "index 0-100"
    threshold_logic: "<30 oversold, >70 overbought, 45-55 neutral zone"
    source_location: "SRC-001 line 101, SRC-002 line 40-60"
    ambiguity: "SKILL.md only says 'Relative Strength Index'. Wilder confirmed in indicators.md."

  - formula_id: F-MACD-ACTIVE
    display_name: "MACD (12/26/9)"
    modes_used: [ACTIVE]
    mathematical_definition: "macdLine=EMA(12)-EMA(26), signalLine=EMA(macdLine,9)"
    input_series: [weekly_close]
    input_frequency: WEEKLY
    lookback_window: [12, 26, 9]
    warmup_requirement: AMBIGUOUS
    missing_data_policy: AMBIGUOUS
    zero_value_policy: AMBIGUOUS
    adjustment_policy: AMBIGUOUS
    rounding_policy: AMBIGUOUS
