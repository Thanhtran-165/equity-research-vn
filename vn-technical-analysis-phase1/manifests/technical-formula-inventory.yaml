    threshold_logic: "MACD > Signal = bullish +1, MACD < Signal = bearish -1"
    source_location: "SRC-001 line 102, SRC-002 line 65-80"
    ambiguity: "EMA seeding: indicators.md uses out[0]=data[0] (not SMA seed). Not stated in SKILL.md."

  - formula_id: F-BOLL-ACTIVE
    display_name: "Bollinger Bands (MA20 ± 2σ)"
    modes_used: [ACTIVE]
    mathematical_definition: "middle=MA(20), upper=middle+2σ, lower=middle-2σ. σ uses population std (÷N, not ÷N-1)"
    input_series: [weekly_close]
    input_frequency: WEEKLY
    lookback_window: 20
    warmup_requirement: AMBIGUOUS
    missing_data_policy: AMBIGUOUS
    zero_value_policy: AMBIGUOUS
    adjustment_policy: AMBIGUOUS
    rounding_policy: AMBIGUOUS
    output_unit: "price"
    threshold_logic: "BB position >50% = +1, <50% = -1. <20% oversold, >80% overbought"
    source_location: "SRC-001 line 103, SRC-002 line 85-100"
    ambiguity: "SKILL.md says 'MA20 ± 2σ' without population/sample. indicators.md uses ÷period (population). stock_profile_blocks.md helpers use ÷(n-1) (sample). INCONSISTENT between modes."

  - formula_id: F-BETA-ACTIVE
    display_name: "Beta (cov/var)"
    modes_used: [ACTIVE]
