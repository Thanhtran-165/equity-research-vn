# VTA Phase 3 Implementation Review — VC → Verifier Mapping
# Per OWNER DIRECTIVE (Implementation Review deliverable)
#
# DESIGN ONLY — no implementation code.
# Maps each of the 64 unique VCs (after VC-FAB-VAL-1 MERGE) to its proposed
# verifier module, verifier function, fixture design, expected outcomes, and
# oracle source.
#
# Canonical inputs:
#   - verifier-obligation-matrix.yaml (65 records, frozen 2026-07-25)
#   - vta-vc-duplicate-resolution.yaml (MERGE_TRUE_DUPLICATES → 64 unique)
#   - failure-mode-coverage-plan.yaml (mutation test classes)
#   - oracle-disposition-registry.yaml (oracle sources)

vc_to_verifier_mapping:
  version: "1.0.0"
  frozen_at: "2026-07-28"
  phase: PHASE_3_IMPLEMENTATION_REVIEW
  artifact_class: DESIGN

  canonical_inputs:
    verifier_obligation_matrix:
      path: vn-technical-analysis-phase2B/manifests/verifier-obligation-matrix.yaml
      version: "1.0.0"
      frozen_at: "2026-07-25"
      total_records: 65
    duplicate_resolution:
      path: vn-technical-analysis-phase3-readiness/manifests/vta-vc-duplicate-resolution.yaml
      resolution: MERGE_TRUE_DUPLICATES
      merged_id: VC-FAB-VAL-1
      records_after_merge: 64
    failure_mode_coverage:
      path: vn-technical-analysis-phase2B/manifests/failure-mode-coverage-plan.yaml
      version: "1.0.0"
    oracle_disposition:
      path: vn-technical-analysis-phase2B/manifests/oracle-disposition-registry.yaml
      version: "1.0.0"

  authorization_boundary:
    verifier_code_authorized: false
    design_artifact_authorized: true
    note: >
      This artifact describes PROPOSED verifier modules and functions only.
      Per vta-phase-3-implementation-scope.yaml Section 7, no .py verifier
      files exist. All implementation_surface entries are PROPOSED targets.

  # ==================================================================
  # Verifier architecture (PROPOSED — per implementation-scope Section 7)
  # ==================================================================

  proposed_verifier_architecture:
    entrypoint: "verifier/vta_verifier.py"
    modules:
      - verifier/schema_conformance.py
      - verifier/formula_conformance.py
      - verifier/provenance_integrity.py
      - verifier/setup_semantics.py
      - verifier/language_policy.py
      - verifier/boundary_enforcement.py
    oracle_independence:
      mathematical_contracts_frozen_before_implementation: true
      expected_outputs_frozen_before_qualification: true
      expected_failure_codes_predeclared: true
      fixtures_not_generated_by_production_code: true
      forbidden_oracle: "production implementation as expected-output oracle"

