          - step: 2
            action: "VPC over 100-bar window"
          - step: 3
            action: "VPR over 20-bar window"
          - step: 4
            action: "VM over 20-bar window"
          - step: 5
            action: "VPCI = VPC × VPR × VM"
          - step: 6
