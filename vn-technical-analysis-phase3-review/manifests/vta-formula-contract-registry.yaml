      source_locations:
        - "SRC-007 stock_profile_blocks.md line 65, 75"
      inherited_from_phase1: "F-PERCENTILE-PROFILE"

      mathematical_definition:
        calc_spec: "percentile_of_value(v, series) = count(series < v) / count(series) × 100 — FLOOR COUNTING (no interpolation). quantile_helper(series, p) = linear-interpolated quantile at probability p — separate function, LINEAR."
        calculation_sequence:
          - step: 1
            action: "For percentile_of_value: count strict less-than, divide by total non-null, × 100"
          - step: 2
            action: "For quantile_helper: standard linear interpolation between order statistics"
        required_inputs: [value, series]
        input_units: {value: same-as-series, series: numeric}
        parameter_constraints:
          percentile_of_value_method: FLOOR_COUNTING  # DECISION FROZEN — O-012
