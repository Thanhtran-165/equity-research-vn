    - formula_id: F-VAR-ES
      canonical_name: "Historical Value at Risk and Expected Shortfall (95/99)"
      indicator_or_metric: RISK_METRIC
      modes: [PROFILE]
      source_locations:
        - "SRC-007 stock_profile_blocks.md B5/B6 line 380-420"
      inherited_from_phase1: "F-VAR-ES-PROFILE"

      mathematical_definition:
        calc_spec: "Historical VaR_α = quantile(returns, α) for α ∈ {0.05, 0.01}; ES_α = mean(returns[returns ≤ VaR_α]). Quantile method: LINEAR interpolation (numpy.linear default)."
        calculation_sequence:
          - step: 1
            action: "Compute daily returns series"
          - step: 2
            action: "VaR_95 = quantile(returns, 0.05); VaR_99 = quantile(returns, 0.01) — LINEAR interpolation"
          - step: 3
            action: "ES_95 = mean(returns[returns ≤ VaR_95]); ES_99 = mean(returns[returns ≤ VaR_99])"
        required_inputs: [daily_close]
        input_units: {returns: "fraction"}
        parameter_constraints:
          confidence_levels: [95, 99]  # DECISION FROZEN — O-011
          lookback: 252  # 1 trading year (window set OPTION_21_63_126_252)
