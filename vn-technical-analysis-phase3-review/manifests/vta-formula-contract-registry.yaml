    # ------------------------------------------------------------------
    - formula_id: F-HVB
      canonical_name: "High Volume Behavior — events_1y via 365-day calendar window"
      indicator_or_metric: PROFILE_BLOCK
      modes: [PROFILE]
      source_locations:
        - "SRC-007 stock_profile_blocks.md B14 line 1000-1050"
      inherited_from_phase1: "F-HVB-PROFILE"

      mathematical_definition:
        calc_spec: "events = bars where volume ≥ 2 × SMA(volume, 20). events_1y = events where effective_date >= (as_of_date - 365 calendar days). For each event compute forward 5/20/60-day returns. positive_rate = count(fwd_return > 0) / count(events_1y); median_fwd_return = median(fwd_returns). Label 'giữ giá tốt' iff positive_rate ≥ 0.60 AND median > 0; label 'suy yếu' iff positive_rate ≤ 0.40 AND median < 0; else 'không xác định'."
        calculation_sequence:
          - step: 1
            action: "Detect events via volume ≥ 2 × SMA(volume, 20)"
          - step: 2
            action: "Filter events_1y by effective_date >= as_of_date - 365 calendar days (NOT events[-252:])"
          - step: 3
            action: "Compute forward 5/20/60-day returns from each event"
          - step: 4
            action: "Aggregate positive_rate, median"
          - step: 5
            action: "Assign non-advice label"
        required_inputs: [daily_close, daily_volume, daily_trade_date]
        input_units: {prices: "price", volume: "shares", trade_date: "ISO date"}
        parameter_constraints:
          volume_threshold_multiplier: 2.0
          avg_window: 20
          forward_return_horizons: [5, 20, 60]
          events_1y_selection: CALENDAR_WINDOW_365_DAYS  # DECISION FROZEN — O-013 / Sol §4; NEVER events[-252:]
          label_positive_rate_threshold: 0.60
          label_negative_rate_threshold: 0.40

      lookback_window: 252
      warmup_period: 252
      minimum_observations: 252

      price_basis:
        adjusted_price_policy: ADJUSTED_OHLCV
        corporate_action_policy: "Forward returns computed on adjusted close; event detection uses adjusted volume"

      timestamp_alignment: INNER_JOIN_BY_TRADE_DATE
      required_sort_order: CHRONOLOGICAL_ASCENDING
      duplicate_bar_behavior: DEDUP_LAST_WINS
      missing_bar_behavior: WARN_AND_CONTINUE
      missing_data_behavior: PASS_THROUGH_AS_MISSING
      null_and_NaN_behavior:
        nan_volume: DETECT_PROPAGATE_AS_MISSING
        nan_close: DETECT_PROPAGATE_AS_MISSING
      zero_division_behavior:
        policy: "SMA(volume) == 0 → no event detected; count(events_1y) == 0 → emit error_code INSUFFICIENT_EVENTS"
        error_code_on_pathological_input: INSUFFICIENT_EVENTS
      insufficient_history_behavior: FAIL_CLOSED_INSUFFICIENT_HISTORY

      numerical_tolerance: 1.0e-9
      floating_point_policy:
        summation: KAHAN
        precision: FLOAT64
        reproducible: true
      output_rounding_policy:
        internal: FULL_FLOAT64
        presentation: 4

      output_schema:
        events_count_1y: {type: integer}
        positive_rate_5d: {type: number, range: "[0, 1]"}
        positive_rate_20d: {type: number, range: "[0, 1]"}
        positive_rate_60d: {type: number, range: "[0, 1]"}
        median_fwd_return_5d: {type: number}
        median_fwd_return_20d: {type: number}
        median_fwd_return_60d: {type: number}
        behavior_label: {type: string, enum: [GIU_GIA_TOT, SUY_YEU, KHONG_XAC_DINH]}
        warmup_complete: {type: boolean}
        provenance: {type: object}

      provenance_fields: [source_provider, trade_date, price_basis, as_of_date, events_1y_selection_method, computation_chain_id]
      deterministic_requirements: {same_input_same_output: true}

      related_requirement_ids: [VTA-REQ-002, VTA-REQ-013]
      related_VC_ids: [VC-EVENTS-1Y-1, VC-ZERO-VOL-1, VC-NAN-PROP-1]
      related_oracle_ids: [O-013]
      known_defect_addressed: B14_EVENTS_1Y
      review_status: ACCEPT_AS_CANONICAL
      freeze_authority: "Sol §4 (calendar window selection by effective_date)"
      residual_ambiguities: []

