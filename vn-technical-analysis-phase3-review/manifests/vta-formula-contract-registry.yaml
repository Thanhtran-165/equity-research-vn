# VTA Phase 3 Implementation Review — Formula Contract Registry
# DESIGN ONLY artifact. NO implementation code. YAML specification only.
#
# Purpose: Freeze the 12 formula contracts mandated by OWNER DIRECTIVE Section 5
# gate (expected_formula_files = 12). Each contract resolves every ambiguity
# inherited from Phase 1 so that ambiguous_formula_contracts = 0.
#
# Canonical inputs consumed:
#   - vn-technical-analysis-phase1/manifests/technical-formula-inventory.yaml
#       (28 formulas; 22 unique semantic; 17 ambiguous)
#   - vn-technical-analysis-phase2A/requirements/requirement-registry.yaml
#       (15 VTA-REQs)
#   - vn-technical-analysis-phase2B/manifests/verifier-obligation-matrix.yaml
#       (65 records; 64 unique VCs — VC-FAB-VAL-1 appears twice by design)
#   - vn-technical-analysis-phase2B/manifests/formula-traceability-matrix.yaml
#       (22 formula families traced)
#   - vn-technical-analysis-phase2B/manifests/oracle-disposition-registry.yaml
#       (24 oracles dispositioned)
#   - vn-technical-analysis-phase2B/manifests/technical-phase3-design-input-package.yaml
#       (38 Phase 3 obligations)

vta_formula_contract_registry:
  version: "1.0.0"
  frozen_at: "2026-07-28"
  artifact_class: DESIGN_ONLY
  workstream: vn-technical-analysis
  phase: PHASE_3_IMPLEMENTATION_REVIEW
  review_authority: "OWNER DIRECTIVE Section 5"
  canonical_readiness_commit: d75a9a3ac56db642ff8fa5623898ea7f4733222a

  # ====================================================================
  # Shared policies (apply to every contract unless overridden inline)
  # ====================================================================
  shared_policies:

    price_basis:
      # From O-007 / VTA-REQ-004 (Sol §2)
      indicators_and_patterns: ADJUSTED_OHLCV
      returns_and_beta: TOTAL_RETURN_ADJUSTED_CLOSE
      raw_for_provenance: RAW_OHLCV
      unknown_adjustment_behavior: FAIL_CLOSED
      corporate_action_policy: "Recompute affected windows from corporate-action effective date forward; never backfill"

    timestamp_alignment:
      method: INNER_JOIN_BY_TRADE_DATE
      misaligned_benchmark_behavior: "Inner-join on common trade dates, emit PROVENANCE warning"
      none_benchmark_behavior: "Fail-closed with error_code BENCHMARK_UNAVAILABLE (per O-021 fix obligation)"

    sort_order:
      required: CHRONOLOGICAL_ASCENDING_BY_TRADE_DATE
      enforcement: "VC-UNSORTED-1 — input not sorted → sort then warn; no silent reordering of mid-stream output"

    duplicate_bar_behavior:
      policy: DEDUP_LAST_WINS
      enforcement: "VC-DUP-TS-1 — duplicate trade_date → keep last observation, warn in provenance"

    missing_bar_behavior:
      policy: WARN_AND_CONTINUE
      gap_threshold_pct: 10
      max_gap_handling: "Treat as missing observation (no synthetic fill, no forward fill) per VTA-REQ-012"
      enforcement: "VC-MISS-INT-1"

    missing_data_behavior:
      behavior: PASS_THROUGH_AS_MISSING  # downstream decides: skip / NaN / fail
      no_synthetic_injection: true
      enforcement: "VC-NO-FAB-2, VC-FAB-VAL-1"

    null_and_NaN_behavior:
      null_close: FAIL_CLOSED_INSUFFICIENT_HISTORY
      nan_in_required_series: "VC-NAN-PROP-1 — detect, propagate as missing; no silent masking"
      nan_in_optional_series: "Skip observation for that series only; block output remains valid"

    zero_division_behavior:
      policy: DETECT_AND_EMIT_ERROR_CODE
      enforcement: "VC-DIV-ZERO-1 — std=0 or denominator=0 → no crash, emit warning/error_code"
      fallback_value: null  # NEVER fabricate; emit missing or error

    insufficient_history_behavior:
      policy: FAIL_CLOSED
      error_code: INSUFFICIENT_HISTORY
      enforcement: "VC-INHIST-1, VC-EMPTY-SERIES-1"

    numerical_tolerance:
      default: 1.0e-9
      comparison_epsilon: 1.0e-6
      reference_calibration_tolerance: 1.0e-6  # against ta-lib / reference libraries

    floating_point_policy:
      summation: KAHAN_FOR_LONG_WINDOWS  # for window >= 60
      no_mixed_precision: true  # all calculations in float64
      reproducible_across_runs: true

    output_rounding_policy:
      presentation_decimal_places: 4
      internal_storage: FULL_FLOAT64  # round only at presentation layer
      provenance_records_unrounded: true

    provenance_fields: [source_provider, trade_date, price_basis, params, computation_chain_id, computation_timestamp]

    deterministic_requirements:
      same_input_same_output: true
      no_wall_clock_dependency: true  # except provenance_timestamp
      no_network_dependency: true
      no_random_source: true
      ordered_iteration: true

  # ====================================================================
  # Per-formula contracts (12)
  # ====================================================================
  formula_contracts:

    # ------------------------------------------------------------------
    # 1. F-RSI (Wilder smoothing)
    # ------------------------------------------------------------------
    - formula_id: F-RSI
      canonical_name: "Relative Strength Index — Wilder Smoothing"
      indicator_or_metric: INDICATOR
      modes: [ACTIVE, PROFILE]
      source_locations:
        - "SRC-001 SKILL.md line 101"
        - "SRC-002 indicators.md line 40-60"
      inherited_from_phase1: "F-RSI-ACTIVE"

      mathematical_definition:
        calc_spec: "Wilder smoothing: avgGain_t = (avgGain_{t-1} × (period-1) + gain_t) / period; avgLoss_t = (avgLoss_{t-1} × (period-1) + loss_t) / period; RS = avgGain / avgLoss; RSI = 100 - 100/(1+RS)"
        calculation_sequence:
          - step: 1
            action: "Compute period-on-period deltas from weekly_close"
          - step: 2
            action: "Split into gains (max(delta,0)) and losses (max(-delta,0))"
          - step: 3
            action: "Seed avgGain/avgLoss as arithmetic mean of first `period` gains/losses (Wilder SMA seed)"
          - step: 4
            action: "Recurse with period-1 multiplier"
          - step: 5
            action: "RS = avgGain / avgLoss; RSI = 100 - 100/(1+RS)"
        required_inputs: [weekly_close]
        input_units: {weekly_close: "price (nghìn đồng)"}
        parameter_constraints:
          period: 14
          smoothing: WILDER  # period-1 multiplier — NOT simple/EMA
          seeding: SMA_SEED_OVER_FIRST_PERIOD  # not data[0]

      lookback_window: 14
      warmup_period: 15  # period + 1 delta; first valid RSI at bar index period (0-based)
      minimum_observations: 15  # warmup + 1 for delta seed

      price_basis:
        adjusted_price_policy: ADJUSTED_CLOSE
        corporate_action_policy: "Recompute from corporate-action effective date forward; never backfill pre-adjusted close"

      timestamp_alignment: INNER_JOIN_BY_TRADE_DATE
      required_sort_order: CHRONOLOGICAL_ASCENDING
      duplicate_bar_behavior: DEDUP_LAST_WINS
      missing_bar_behavior: WARN_AND_CONTINUE
      missing_data_behavior: PASS_THROUGH_AS_MISSING
      null_and_NaN_behavior:
        null_close: FAIL_CLOSED_INSUFFICIENT_HISTORY
        nan_close: DETECT_PROPAGATE_AS_MISSING
      zero_division_behavior:
        policy: "avgLoss == 0 → RSI = 100 (defined limit); avgGain == 0 and avgLoss == 0 → RSI = 50 (neutral)"
        error_code_on_pathological_input: DIV_ZERO_DETECTED
      insufficient_history_behavior: FAIL_CLOSED_INSUFFICIENT_HISTORY

      numerical_tolerance: 1.0e-9
      floating_point_policy:
        summation: KAHAN
        precision: FLOAT64
        reproducible: true
      output_rounding_policy:
        internal: FULL_FLOAT64
        presentation: 4

      output_schema:
        rsi_value: {type: number, range: "[0, 100]", unit: index}
        warmup_complete: {type: boolean}
        provenance: {type: object}

      provenance_fields: [source_provider, trade_date, price_basis, period, smoothing_method, computation_chain_id]
      deterministic_requirements: {same_input_same_output: true, no_random_source: true}

      related_requirement_ids: [VTA-REQ-001, VTA-REQ-005]
      related_VC_ids: [VC-RSI-WILDER-1, VC-RSI-WILDER-2, VC-WRONG-SMOOTH-1, VC-NAN-PROP-1, VC-DIV-ZERO-1]
      related_oracle_ids: [O-001]
      review_status: ACCEPT_AS_CANONICAL
      freeze_authority: "Wilder 1978 + ta-lib calibration"
      residual_ambiguities: []

    # ------------------------------------------------------------------
    # 2. F-BOLLINGER (std convention)
    # ------------------------------------------------------------------
    - formula_id: F-BOLLINGER
      canonical_name: "Bollinger Bands — Shared Kernel Std Convention"
      indicator_or_metric: INDICATOR
      modes: [ACTIVE, PROFILE]
      source_locations:
        - "SRC-001 SKILL.md line 103"
        - "SRC-002 indicators.md line 85-100"
        - "SRC-007 stock_profile_blocks.md line 56"
      inherited_from_phase1: "F-BOLL-ACTIVE"

      mathematical_definition:
        calc_spec: "middle = SMA(close, window); std = population_std(close, window) = sqrt( Σ(x_i - mean)^2 / window ); upper = middle + multiplier × std; lower = middle - multiplier × std"
        calculation_sequence:
          - step: 1
            action: "SMA over window"
          - step: 2
            action: "Population standard deviation (÷N, NOT ÷N-1) — shared kernel decision"
          - step: 3
            action: "upper/lower = middle ± multiplier × std"
          - step: 4
            action: "bb_position = (close - lower) / (upper - lower) × 100"
        required_inputs: [close]
        input_units: {close: "price"}
        parameter_constraints:
          window: 20  # ACTIVE; PROFILE may use 20 (no month/quarter variant)
          multiplier: 2.0
          std_convention: POPULATION_DIV_N  # DECISION FROZEN — O-002 / §5 reconciliation
          shared_kernel: SAME_CONVENTION_BOTH_MODES  # VC-BOLL-2 / VC-MODE-KERNEL-1

      lookback_window: 20
      warmup_period: 20
      minimum_observations: 20

      price_basis:
        adjusted_price_policy: ADJUSTED_CLOSE
        corporate_action_policy: "Recompute from corporate-action effective date forward"

      timestamp_alignment: INNER_JOIN_BY_TRADE_DATE
      required_sort_order: CHRONOLOGICAL_ASCENDING
      duplicate_bar_behavior: DEDUP_LAST_WINS
      missing_bar_behavior: WARN_AND_CONTINUE
      missing_data_behavior: PASS_THROUGH_AS_MISSING
      null_and_NaN_behavior:
        nan_close: DETECT_PROPAGATE_AS_MISSING
      zero_division_behavior:
        policy: "std == 0 → upper=middle=lower; bb_position undefined → emit 50 (neutral) with warning"
        error_code_on_pathological_input: DIVZERO_DETECTED
      insufficient_history_behavior: FAIL_CLOSED_INSUFFICIENT_HISTORY

      numerical_tolerance: 1.0e-9
      floating_point_policy:
        summation: KAHAN
        precision: FLOAT64
        reproducible: true
      output_rounding_policy:
        internal: FULL_FLOAT64
        presentation: 4

      output_schema:
        middle_band: {type: number}
        upper_band: {type: number}
        lower_band: {type: number}
        bb_position_pct: {type: number, range: "[0, 100]"}
        warmup_complete: {type: boolean}
        provenance: {type: object}

      provenance_fields: [source_provider, trade_date, price_basis, window, multiplier, std_convention, computation_chain_id]
      deterministic_requirements: {same_input_same_output: true, identical_across_modes: true}

      related_requirement_ids: [VTA-REQ-001, VTA-REQ-006]
      related_VC_ids: [VC-BOLL-1, VC-BOLL-2, VC-MODE-KERNEL-1, VC-DIV-ZERO-1]
      related_oracle_ids: [O-002]
      review_status: ACCEPT_AS_CANONICAL
      freeze_authority: "Bollinger reference + Section 5 std convention reconciliation (OPTION_POPULATION recommended)"
      residual_ambiguities: []
      cross_formula_consistency: "Same shared kernel MUST be used by F-HV std computation; if F-HV chooses sample std, that decision is HEMMED to F-HV only (not Bollinger)."

    # ------------------------------------------------------------------
    # 3. F-MA (SMA vs EMA)
    # ------------------------------------------------------------------
    - formula_id: F-MA
      canonical_name: "Moving Average — SMA canonical; EMA only for MACD"
      indicator_or_metric: INDICATOR
      modes: [ACTIVE, PROFILE]
      source_locations:
        - "SRC-001 SKILL.md line 100"
        - "SRC-002 indicators.md line 15-30"
        - "SRC-007 stock_profile_blocks.md"
        - "metric_guardrails.md"
      inherited_from_phase1: "F-MA-ACTIVE"

      mathematical_definition:
        calc_spec: "SMA: sum(close[i-period+1..i]) / period. EMA variant: k = 2/(period+1); EMA_t = close_t × k + EMA_{t-1} × (1-k); used ONLY by F-MACD."
        calculation_sequence:
          - step: 1
            action: "SMA over canonical window set"
          - step: 2
            action: "Return NaN during warmup (no backfill, no forward fill)"
        required_inputs: [close]
        input_units: {close: "price"}
        parameter_constraints:
          ma_type: SMA  # canonical for MA10/20/50
          ema_prohibited_for_ma_field: true  # EMA is exclusively a MACD primitive
          window_set_canonical: [21, 63, 126, 252]  # §4 reconciliation — OPTION_21_63_126_252 recommended
          window_aliases_presented: {21: "1M", 63: "3M", 126: "6M", 252: "1Y"}
          warmup_policy: RETURN_NAN_THEN_VALID  # no backfill

      lookback_window: 252  # max of canonical set
      warmup_period: "per-period (period bars before first valid output)"
      minimum_observations: 252  # for full PROFILE rolling use

      price_basis:
        adjusted_price_policy: ADJUSTED_CLOSE
        corporate_action_policy: "Recompute from corporate-action effective date forward"

      timestamp_alignment: INNER_JOIN_BY_TRADE_DATE
      required_sort_order: CHRONOLOGICAL_ASCENDING
      duplicate_bar_behavior: DEDUP_LAST_WINS
      missing_bar_behavior: WARN_AND_CONTINUE
      missing_data_behavior: PASS_THROUGH_AS_MISSING
      null_and_NaN_behavior:
        nan_close: DETECT_PROPAGATE_AS_MISSING
      zero_division_behavior:
        policy: "Window denominator is constant (period); no division hazard"
      insufficient_history_behavior: FAIL_CLOSED_INSUFFICIENT_HISTORY

      numerical_tolerance: 1.0e-9
      floating_point_policy:
        summation: KAHAN
        precision: FLOAT64
        reproducible: true
      output_rounding_policy:
        internal: FULL_FLOAT64
        presentation: 4

      output_schema:
        ma_values: {type: object, keys: ["21", "63", "126", "252"], values: number_or_null}
        warmup_complete: {type: object}
        provenance: {type: object}

      provenance_fields: [source_provider, trade_date, price_basis, ma_type, window_set, computation_chain_id]
      deterministic_requirements: {same_input_same_output: true}

      related_requirement_ids: [VTA-REQ-001]
      related_VC_ids: [VC-WRONG-LOOKBACK-1, VC-NAN-PROP-1]
      related_oracle_ids: [O-003, O-010]
      review_status: ACCEPT_AS_CANONICAL
      freeze_authority: "VN trading calendar convention; §4 window reconciliation (OPTION_21_63_126_252)"
      residual_ambiguities: []
      cross_formula_consistency: "Window set MUST match F-ROLLING-RETURN canonical set; only the latter is out of this registry's freeze scope but reference locked here."

    # ------------------------------------------------------------------
    # 4. F-MACD (EMA seed)
    # ------------------------------------------------------------------
    - formula_id: F-MACD
      canonical_name: "MACD (12/26/9) with data[0] EMA seed"
      indicator_or_metric: INDICATOR
      modes: [ACTIVE]
      source_locations:
        - "SRC-001 SKILL.md line 102"
        - "SRC-002 indicators.md line 65-80"
      inherited_from_phase1: "F-MACD-ACTIVE"

      mathematical_definition:
        calc_spec: "macd_line = EMA(close, 12) - EMA(close, 26); signal_line = EMA(macd_line, 9); histogram = macd_line - signal_line. EMA seed: EMA_0 = close[0] (NOT SMA seed)."
        calculation_sequence:
          - step: 1
            action: "EMA(12) with seed = close[0]"
          - step: 2
            action: "EMA(26) with seed = close[0]"
          - step: 3
            action: "macd_line = EMA(12) - EMA(26)"
          - step: 4
            action: "signal_line = EMA(macd_line, 9) with seed = macd_line[0]"
          - step: 5
            action: "histogram = macd_line - signal_line"
        required_inputs: [weekly_close]
        input_units: {weekly_close: "price"}
        parameter_constraints:
          short_period: 12
          long_period: 26
          signal_period: 9
          ema_seed: DATA_0  # DECISION FROZEN — O-004; not SMA(period)
          seed_alternatives_rejected: [SMA_SEED]

      lookback_window: 35  # long + signal - overlap
      warmup_period: 35
      minimum_observations: 35

      price_basis:
        adjusted_price_policy: ADJUSTED_CLOSE
        corporate_action_policy: "Recompute from corporate-action effective date forward"

      timestamp_alignment: INNER_JOIN_BY_TRADE_DATE
      required_sort_order: CHRONOLOGICAL_ASCENDING
      duplicate_bar_behavior: DEDUP_LAST_WINS
      missing_bar_behavior: WARN_AND_CONTINUE
      missing_data_behavior: PASS_THROUGH_AS_MISSING
      null_and_NaN_behavior:
        nan_close: DETECT_PROPAGATE_AS_MISSING
      zero_division_behavior:
        policy: "No division in MACD core; signal line EMA divisor (1+k) is constant"
      insufficient_history_behavior: FAIL_CLOSED_INSUFFICIENT_HISTORY

      numerical_tolerance: 1.0e-9
      floating_point_policy:
        summation: KAHAN
        precision: FLOAT64
        reproducible: true
      output_rounding_policy:
        internal: FULL_FLOAT64
        presentation: 4

      output_schema:
        macd_line: {type: number}
        signal_line: {type: number}
        histogram: {type: number}
        warmup_complete: {type: boolean}
        provenance: {type: object}

      provenance_fields: [source_provider, trade_date, price_basis, short_period, long_period, signal_period, ema_seed_method, computation_chain_id]
      deterministic_requirements: {same_input_same_output: true}

      related_requirement_ids: [VTA-REQ-001]
      related_VC_ids: [VC-NAN-PROP-1]
      related_oracle_ids: [O-004]
      review_status: ACCEPT_AS_CANONICAL
      freeze_authority: "MACD reference + seeding convention (data[0] seed retained for backward consistency)"
      residual_ambiguities: []

    # ------------------------------------------------------------------
    # 5. F-BETA (window + benchmark)
    # ------------------------------------------------------------------
    - formula_id: F-BETA
      canonical_name: "Beta — cov(stock,market) / var(market), 52w window, VNINDEX canonical"
      indicator_or_metric: CORRELATION
      modes: [ACTIVE, PROFILE]
      source_locations:
        - "SRC-001 SKILL.md line 104"
        - "SRC-002 indicators.md line 105-120"
        - "SRC-007 stock_profile_blocks.md line 600"
      inherited_from_phase1: "F-BETA-ACTIVE"

      mathematical_definition:
        calc_spec: "β = Cov(stock_returns, market_returns) / Var(market_returns), POPULATION covariance (÷N, not ÷N-1). Returns basis: simple (pct_change), not log."
        calculation_sequence:
          - step: 1
            action: "Compute simple weekly returns for stock and benchmark from total_return_adjusted_close"
          - step: 2
            action: "Inner-join on common trade dates"
          - step: 3
            action: "Population covariance and variance over 52-week window"
          - step: 4
            action: "β = cov / var"
        required_inputs: [weekly_close_stock, weekly_close_benchmark]
        input_units: {returns: "fraction (not percent)"}
        parameter_constraints:
          window: 52  # DECISION FROZEN — O-005
          return_basis: SIMPLE  # DECISION FROZEN — O-005; not log
          covariance_convention: POPULATION_DIV_N  # consistent with F-BOLLINGER std decision
          benchmark_canonical: VNINDEX  # §8 reconciliation — VN30 secondary
          benchmark_secondary: VN30  # documented only; produces different β

      lookback_window: 52
      warmup_period: 52
      minimum_observations: 52

      price_basis:
        adjusted_price_policy: TOTAL_RETURN_ADJUSTED_CLOSE  # for returns/beta per O-007
        corporate_action_policy: "Use total-return-adjusted series; recompute from corporate-action effective date forward"

      timestamp_alignment: INNER_JOIN_BY_TRADE_DATE
      required_sort_order: CHRONOLOGICAL_ASCENDING
      duplicate_bar_behavior: DEDUP_LAST_WINS
      missing_bar_behavior: WARN_AND_CONTINUE
      missing_data_behavior: PASS_THROUGH_AS_MISSING
      null_and_NaN_behavior:
        null_benchmark: "Fail-closed with BENCHMARK_UNAVAILABLE (O-021 fix obligation)"
        nan_returns: DETECT_PROPAGATE_AS_MISSING
      zero_division_behavior:
        policy: "Var(market) == 0 → β undefined → emit error_code DIVZERO_DETECTED, no fabricated value"
        error_code_on_pathological_input: DIVZERO_DETECTED
      insufficient_history_behavior: FAIL_CLOSED_INSUFFICIENT_HISTORY

      numerical_tolerance: 1.0e-9
      floating_point_policy:
        summation: KAHAN
        precision: FLOAT64
        reproducible: true
      output_rounding_policy:
        internal: FULL_FLOAT64
        presentation: 4

      output_schema:
        beta_value: {type: number}
        benchmark_used: {type: string, enum: [VNINDEX, VN30]}
        window_weeks: {type: integer}
        warmup_complete: {type: boolean}
        provenance: {type: object}

      provenance_fields: [source_provider, trade_date, price_basis, window, return_basis, benchmark_used, covariance_convention, computation_chain_id]
      deterministic_requirements: {same_input_same_output: true}

      related_requirement_ids: [VTA-REQ-001]
      related_VC_ids: [VC-BENCH-MISALIGN-1, VC-PRICE-BASIS-2, VC-DIV-ZERO-1, VC-NAN-PROP-1]
      related_oracle_ids: [O-005, O-018]
      review_status: ACCEPT_AS_CANONICAL
      freeze_authority: "Calibration + return basis decision + §8 benchmark assignment"
      residual_ambiguities: []

    # ------------------------------------------------------------------
    # 6. F-CMF / F-MONEY-FLOW
    # ------------------------------------------------------------------
    - formula_id: F-CMF
      canonical_name: "Chaikin Money Flow (20) — separate OBV/VPT source series"
      indicator_or_metric: VOLUME_FLOW
      modes: [PROFILE]
      source_locations:
        - "SRC-007 stock_profile_blocks.md B12 line 860-900"
      inherited_from_phase1: "F-CMF-PROFILE"
      alternate_ids: [F-MONEY-FLOW]

      mathematical_definition:
        calc_spec: "MFV = ((close-low) - (high-close)) / (high-low) × volume; CMF = SMA(MFV, 20) / SMA(volume, 20). obv_change sourced from OBV series; vpt_change sourced from VPT series — SEPARATE source series mandated."
        calculation_sequence:
          - step: 1
            action: "Money Flow Multiplier per bar"
          - step: 2
            action: "Money Flow Volume = MFM × volume"
          - step: 3
            action: "SMA(MFV, 20) / SMA(volume, 20)"
          - step: 4
            action: "Compute OBV change from OBV series (independent) and VPT change from VPT series (independent) — never alias one to the other"
        required_inputs: [daily_high, daily_low, daily_close, daily_volume]
        input_units: {prices: "price", volume: "shares"}
        parameter_constraints:
          window: 20
          obv_vpt_separation: MANDATORY  # O-024 / VTA-REQ-014 / B12 bug fix
          obv_alias_to_vpt: PROHIBITED

      lookback_window: 20
      warmup_period: 20
      minimum_observations: 20

      price_basis:
        adjusted_price_policy: ADJUSTED_OHLCV
        corporate_action_policy: "Recompute from corporate-action effective date forward; volume adjusted per adjustment factor"

      timestamp_alignment: INNER_JOIN_BY_TRADE_DATE
      required_sort_order: CHRONOLOGICAL_ASCENDING
      duplicate_bar_behavior: DEDUP_LAST_WINS
      missing_bar_behavior: WARN_AND_CONTINUE
      missing_data_behavior: PASS_THROUGH_AS_MISSING
      null_and_NaN_behavior:
        nan_ohlcv: DETECT_PROPAGATE_AS_MISSING
      zero_division_behavior:
        policy: "high == low → MFM defined as 0 (avoid div-by-zero); SMA(volume) == 0 → emit error_code DIVZERO_DETECTED"
        error_code_on_pathological_input: DIVZERO_DETECTED
      insufficient_history_behavior: FAIL_CLOSED_INSUFFICIENT_HISTORY

      numerical_tolerance: 1.0e-9
      floating_point_policy:
        summation: KAHAN
        precision: FLOAT64
        reproducible: true
      output_rounding_policy:
        internal: FULL_FLOAT64
        presentation: 4

      output_schema:
        cmf_value: {type: number, range: "[-1, 1]"}
        obv_change: {type: number, source_series: OBV}
        vpt_change: {type: number, source_series: VPT}
        warmup_complete: {type: boolean}
        provenance: {type: object}

