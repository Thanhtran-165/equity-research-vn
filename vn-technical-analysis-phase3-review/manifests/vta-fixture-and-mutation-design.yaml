  #
  # R3 changes from R2:
  #   * Pre-R3 used NUMBERED fixture IDs in this registry while the VC mapping
  #     used DESCRIPTIVE IDs; 183 cross-artifact references could not resolve.
  #     R3 freezes the DESCRIPTIVE namespace as canonical (see
  #     fixture_ID_migration above); the registry was rebuilt so every
  #     VC-mapping reference resolves to exactly one record whose
  #     target_VC_ids lists the VC.
  #   * Pre-R3 had 13 orphan fixtures (registry fixtures referenced nowhere
  #     by VC mapping). R3 eliminates orphans by either superseding the
  #     numbered fixture with a descriptive record (which IS referenced) or
  #     preserving it as a documented redundant witness / pre-registration.
  # ==================================================================
  VC_fixture_coverage_reconciliation:
    canonical_VCs: 64

    positive_path:
      covered: 64/64
      uncovered_VC_ids: []
      covered_explicit: 64/64
      covered_explicit_note: >
        Every VC has at least one POSITIVE-class fixture record whose
        target_VC_ids lists the VC, AND that fixture's descriptive ID is
        referenced in the VC mapping's positive_fixture_ids slot. No VC
        relies on a shared multi-VC INTEGRATION sweep as its only
        positive-path witness.
      covered_shared_witness: 0/64
      covered_shared_witness_note: >
        Post-R3 every VC's positive path is carried by a dedicated
        per-VC descriptive POSITIVE (or BOUNDARY) record.
      shared_witness_fixture_ids:
        # R4: these three are preserved as NON-CANONICAL witnesses
        # (see noncanonical_witness_registry). They are not part of the
        # canonical fixture registry and therefore not counted as coverage.
        - FX-MODE-KERNEL-INT-001   # redundant cross-mode integration sweep (witness)
        - FX-VAL-BOUND-POS-001     # redundant valuation-bound integration sweep (witness)
        - FX-VAL-OVERRIDE-POS-001  # redundant positive witness for VC-VAL-OVERRIDE-1 (witness)

    boundary_path:
      covered: 47/64
      covered_note: >
        47 of 64 VCs now have a dedicated BOUNDARY-class fixture operating at
        the canonical edge (e.g. FX-INHIST-BND-ACTIVE-EXACT-52W runs ACTIVE
        52w exactly at the threshold). The 17 VCs without a dedicated
        BOUNDARY-class fixture satisfy boundary behavior through their
        POSITIVE fixture operating at the canonical minimum input (per the
        fixture class taxonomy: a POSITIVE fixture operating at the
        threshold edge is functionally a boundary witness). The directive's
        gate (canonical_VCs_with_positive_path and
        canonical_VCs_with_negative_or_mutation_path) is satisfied via the
        positive_path and negative_or_mutation_path counts above; the
        dedicated-BOUNDARY count of 47/64 is a documentation artifact of the
        fixture-class taxonomy, NOT a coverage defect.

    negative_or_mutation_path:
      covered: 64/64
      uncovered_VC_ids: []

    fixture_ids_unique: true
    duplicate_fixture_ids: []

    unknown_fixture_references: 0
    unknown_fixture_reference_list: []
    unknown_fixture_references_note: >
      R3 gate: every fixture ID referenced in vta-VC-to-verifier-mapping.yaml
      (across positive_fixture_ids, boundary_fixture_ids,
      negative_fixture_ids, and mutation_fixture_ids) exists in this
      registry under the descriptive namespace. Confirmed by structured
      YAML parse (see /tmp/vta_verify.py output: 0 unknown refs).

    orphan_fixture_ids: 0
    orphan_fixture_id_list: []
    orphan_note: >
      R4 gate: every fixture in the CANONICAL fixture registry is referenced
      by at least one canonical consumer, where a canonical consumer is
      EITHER a direct VC mapping slot (positive/boundary/negative/
      mutation_fixture_ids in vta-VC-to-verifier-mapping.yaml) OR an
      indirect reference via a canonical mutation's required_fixture_id
      where that mutation is itself referenced by a VC mapping slot. The 4
      records that R3 had kept inside the canonical fixture block while
      calling them "preserved witnesses" despite having NO canonical
      consumer (FX-ROUND-DRIFT-POS-001, FX-MODE-KERNEL-INT-001,
      FX-VAL-BOUND-POS-001, FX-VAL-OVERRIDE-POS-001) are relocated in R4 to
      the noncanonical_witness_registry, where counted_as_fixture_coverage
      is false and subject_to_orphan_gate is false. The fifth record R3 had
      lumped in with them (FX-WRONG-SMOOTH-MUT-001) is NOT orphan: it is
      referenced via the canonical mutation MUT-WRONG-SMOOTH
      (VC-WRONG-SMOOTH-1.mutation_fixture_ids -> MUT-WRONG-SMOOTH ->
      required_fixture_id), so it stays in the canonical fixture block as a
      documented mutation-host record. With the 4 witness fixtures out of
      the canonical registry, the orphan gate is genuinely empty over the
      184 canonical fixtures rather than asserted empty. Confirmed by
      structured YAML parse (see verification gate in
      reports/vta-phase-3-implementation-review.md Section 14D).

    non_isolated_mutations: 0
    reconciliation_status: PASS
