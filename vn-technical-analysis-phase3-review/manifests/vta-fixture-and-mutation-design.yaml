    review_R3_namespace_freeze: >
      Pre-R3 this registry used NUMBERED IDs (FX-...-001) while the VC mapping
      used DESCRIPTIVE IDs (FX-...-POS-CLEAN); 183 cross-artifact references
      could not resolve. R3 freezes the DESCRIPTIVE namespace as canonical
      (see fixture_ID_migration block below) and rebuilds the registry so that
      every VC-mapping reference resolves to exactly one registry record whose
      target_VC_ids lists the VC. Pre-R3 numbered fixtures that shared VCs were
      split per-VC; numbered fixtures that lacked a VC-mapping reference were
      either superseded by descriptive records (with their test obligations
      preserved in those records) or retained as documented redundant
      witnesses (FX-MODE-KERNEL-INT-001, FX-VAL-BOUND-POS-001,
      FX-VAL-OVERRIDE-POS-001) and pre-registrations (FX-ROUND-DRIFT-POS-001).
    review_R4_witness_separation: >
      R3 incorrectly kept 4 registry-internal fixtures with no canonical
      consumer, plus FX-WRONG-SMOOTH-MUT-001 (which IS referenced via the
      canonical mutation MUT-WRONG-SMOOTH and was therefore correctly
      canonical but mislabeled an orphan), plus 2 orphan mutations, and
      1 negative-control (MUT-ADV-LANG-NEG) inside the canonical
      fixture/mutation blocks while simultaneously claiming an empty orphan
      gate, which was self-contradictory. R4 moves all 8 records into
      noncanonical_witness_registry (this file) where they are documented as
      witnesses with counted_as_fixture_coverage=false,
      counted_as_mutation_coverage=false, and subject_to_orphan_gate=false.
      The canonical registries now contain only records referenced by a
      canonical consumer (vta-VC-to-verifier-mapping.yaml) plus the mutation
      hosts those mutations reference; the orphan gate is therefore genuinely
      empty rather than asserted empty. MUT-ADV-LANG-NEG is reclassified as the
      NEGATIVE_CONTROL witness fixture FX-ADV-LANG-NEG-CONTROL (expected
      behavior NO_FAILURE) so the mutation contract
      (mutations_without_expected_code: []) holds without exception.
    status: PASS

  # ==================================================================
  # Fixture ID migration reconciliation (Phase 3 implementation review-R3)
  # ------------------------------------------------------------------
  # Per OWNER DIRECTIVE Section 4. Documents every legacy numbered fixture
  # ID and its resolution to a canonical descriptive ID. Two naming
  # conventions co-existed prior to R3:
  #   * VC mapping used DESCRIPTIVE IDs (e.g. FX-ADV-LANG-POS-CLEAN)
  #   * fixture registry used NUMBERED IDs (e.g. FX-ADV-LANG-POS-001)
  # R3 freezes the DESCRIPTIVE namespace as canonical. Every legacy
  # numbered ID is either:
  #   * RENAMED to a single descriptive ID (one-to-one), OR
  #   * SPLIT into multiple descriptive IDs (one-to-many, when the
  #     numbered fixture was shared across VCs whose descriptive refs
  #     carried distinct semantics), OR
  #   * MARKED SUPERSEDED when the descriptive refs fully replaced the
  #     numbered fixture's role (e.g. shared multi-VC POSITIVE fixtures
  #     replaced by per-VC descriptive POSITIVE witnesses).
  # ==================================================================
  fixture_ID_migration:
    canonical_namespace:
      canonical_registry_path: vn-technical-analysis-phase3-review/manifests/vta-fixture-and-mutation-design.yaml
      canonical_ID_format: 'FX-<VC-SHORT>-<CLASS>-<DESCRIPTOR>'
      canonical_ID_examples:
        - FX-ADV-LANG-POS-CLEAN
        - FX-RSI-WILDER-NEG-SIMPLE
        - FX-INHIST-BND-ACTIVE-EXACT-52W
      case_sensitive: true
      alias_resolution_at_runtime: prohibited
    migration_rules:
      many_legacy_IDs_to_one_canonical_ID:
        allowed: true
        condition: semantic_equivalence_proven
      one_legacy_ID_to_multiple_canonical_IDs:
        allowed: true
        condition: original_reference_was_semantically_overloaded
      silent_aliasing:
        allowed: false
      semantic_loss:
        allowed: false
    summary:
      legacy_numbered_fixtures_in_pre_R3_registry: 57
      canonical_descriptive_fixtures_in_R3_registry: 188
        # 183 descriptive IDs (one per VC-mapping reference) + 1 MUTATION
        # (FX-WRONG-SMOOTH-MUT-001 preserved) + 3 INTEGRATION
        # (FX-MODE-KERNEL-INT-001, FX-VAL-BOUND-POS-001,
        # FX-VAL-OVERRIDE-POS-001) + 1 out-of-scope pre-registered
        # (FX-ROUND-DRIFT-POS-001 for VC-ROUND-DRIFT-1).
      renamed_one_to_one: 35
      split_one_to_many: 35
        # 14 one-to-many SPLIT decisions producing 35 canonical IDs
        # (i.e. 21 net-new records beyond the source).
      create_new_descriptive: 113
      legacy_fixtures_superseded_and_removed: 3
        # Three pre-R3 numbered fixtures are fully superseded by descriptive
        # records: their semantics are preserved in those descriptive records
        # but the numbered ID itself no longer appears in the registry:
        #   FX-BEARISH-DESIGN-4-POS-001  -> FX-BEARISH-DESIGN-4-POS-DENOMINATOR-FROZEN (via FX-BEARISH-DESIGN-POS-001 split)
        #   FX-CHANNEL-2-POS-001         -> FX-CHANNEL-2-POS-THRESHOLD-FROZEN      (via FX-CHANNEL-POS-001 split)
        #   FX-FAB-VAL-POS-001           -> FX-NO-FAB-POS-CLEAN                     (created from VC mapping)
        # They are documented below as REMOVE_INVALID_REFERENCE decisions.
    # ----------------------------------------------------------------
    # R4 identity-level migration accounting (directive Section 5)
    # ----------------------------------------------------------------
    # Required identity equation:  57 + records_added - records_removed = 188
    # Satisfied:                    57 + 134        - 3               = 188
    #   records_added   = 113 (CREATE_MISSING_DESIGN_RECORD) + 21 (SPLIT extras)
    #   records_removed = 3   (REMOVE_INVALID_REFERENCE)
    # PRESERVE actions carry net_record_change: 0 (they keep an existing record).
    # MAP_TO_EXISTING_FIXTURE carries net_record_change: 0 (rename, 1->1 identity).
    # ----------------------------------------------------------------
    identity_accounting:
      prior_fixture_records: 57
      records_added: 134
      records_removed: 3
      net_record_change: 131
      final_fixture_records: 188
      equation_valid: true                  # 57 + 134 - 3 = 188
      unexplained_new_records: 0
      unresolved_source_IDs: []
      semantic_loss: false
      canonical_records_after_R4_witness_separation: 184
        # 188 R3 records minus 4 records relocated to
        # noncanonical_witness_registry in R4. FX-WRONG-SMOOTH-MUT-001 is
        # retained as a canonical record because it is referenced by the
        # canonical mutation MUT-WRONG-SMOOTH (canonical-consumer chain
        # VC-WRONG-SMOOTH-1.mutation_fixture_ids -> MUT-WRONG-SMOOTH ->
