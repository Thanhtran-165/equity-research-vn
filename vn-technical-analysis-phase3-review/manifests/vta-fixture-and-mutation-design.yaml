# Technical Phase 3 Implementation Review — VTA Fixture & Mutation Design
# DESIGN ONLY artifact. No code. Defines fixtures and mutations for all 64 unique VCs.
#
# Canonical inputs:
#   - phase2B/manifests/verifier-obligation-matrix.yaml      (65 records, 64 unique VCs; VC-FAB-VAL-1 merged OUTPUT_SCHEMA+PROVENANCE)
#   - phase2B/manifests/failure-mode-coverage-plan.yaml      (failure mode -> VC mapping, 29 FMs, 24 mandatory mutations)
#   - phase1/manifests/technical-failure-mode-registry.yaml  (28 failure modes)
#   - phase3-review/manifests/vta-failure-code-registry.yaml (35 codes this design emits)
#
# Every fixture has an oracle_source. Every mutation has an expected failure code.
# Every mutation is isolated (one mutated behavior, one expected code, no co-firing).

vta_fixture_and_mutation_design:
  version: "1.0.0"
  frozen_at: "2026-07-28"
  artifact_class: DESIGN
  produces_code: false
  review_phase: PHASE_3_IMPLEMENTATION_REVIEW

  # ==================================================================
  # Design principles
  # ==================================================================
  principles:
    - id: FP-ISOLATION
      rule: "Every MUTATION fixture mutates exactly one behavior and expects exactly one primary failure code. No mutation may produce two primary codes simultaneously (see isolation contract)."
    - id: FP-ORACLE-PURITY
      rule: "Every POSITIVE/BOUNDARY fixture declares oracle_source; oracle is never 'trust the engine'. Allowed sources: REFERENCE_LIBRARY (ta-lib), SOL_DECISION, CONTRACT, CLOSED_FORM, BYTE_IDENTICAL_REPLAY, PROPERTY_TEST."
    - id: FP-FROZEN-INPUT
      rule: "frozen_inputs are byte-stable seeds. Re-running a fixture against the same frozen input MUST produce byte-identical output (ties to ROUNDING_DRIFT detection)."
    - id: FP-NO-SURVIVOR
      rule: "A mutation's survivor_risk is the user-visible damage if the mutated behavior ships undetected. HIGH/CRITICAL survivor_risk mutations are mandatory in Phase 4Q; LOW are optional."

  # ==================================================================
  # Fixture class definitions
  # ==================================================================
  fixture_classes:
    - class: POSITIVE
      meaning: "Canonical happy-path input. Engine produces a valid output that satisfies the schema and matches the oracle. No error code fires."
      oracle_required: true
      expected_code_count: 0
    - class: BOUNDARY
      meaning: "Input at the exact edge of an accepted range (minimum history, threshold equality, tolerance boundary). Engine accepts and produces the oracle-defined edge value."
      oracle_required: true
      expected_code_count: 0  # may carry DIAGNOSTIC at the edge (e.g., MISSING_INTERVAL)
    - class: NEGATIVE
      meaning: "Input that violates a contract. Engine rejects fail-closed and emits exactly one PRIMARY code from vta-failure-code-registry.yaml."
      oracle_required: true
      expected_code_count: 1
    - class: MUTATION
      meaning: "A correctly-shaped fixture run through a mutated engine build. The mutation is the variable; the input is frozen. Exactly one PRIMARY code fires."
      oracle_required: true
      expected_code_count: 1
    - class: INTEGRATION
      meaning: "Cross-mode or cross-boundary fixture exercising the integration adapter (ACTIVE+PROFILE kernel sharing, valuation-boundary write-block)."
      oracle_required: true
      expected_code_count: 0_or_1

  # ==================================================================
  # Isolation contract (load-bearing for the gate)
  # ==================================================================
  required_isolation:
    temporal_failures_isolated: true       # partial-week, events-1y, lookback window failures do not co-fire
    numerical_failures_isolated: true      # divide-by-zero, NaN-propagation, std=0 do not co-fire
    schema_failures_isolated: true         # schema-drift, mode-contamination, foreign-key do not co-fire
    provenance_failures_isolated: true     # provenance-missing and fabricated-value do not co-fire on the same field
    setup_semantic_failures_isolated: true # false-breakout, unconfirmed, conflict-setup, archetype-ambiguity do not co-fire
    isolation_mechanism: "Each MUTATION fixture mutates exactly one code path and asserts exactly one expected_failure_code. Co-firing would mean the mutation leaked across concerns."

  # ==================================================================
  # Oracle source catalog
  # ==================================================================
  oracle_sources:
    - id: ORACLE-TALIB-WILDER
      kind: REFERENCE_LIBRARY
      description: "ta-lib RSI Wilder implementation. Tolerance 1e-6."
      authority: "Wilder 1978 + ta-lib reference"
    - id: ORACLE-TALIB-BOLL
      kind: REFERENCE_LIBRARY
      description: "ta-lib Bollinger Bands with frozen std convention."
    - id: ORACLE-SOL-CHANNEL-SLOPE
      kind: SOL_DECISION
      description: "Sol §3 normalized_slope_pct_per_bar = 100 x OLS_slope / median(close_window)."
      authority: "Phase 2A Sol §3"
    - id: ORACLE-SOL-EVENTS-1Y
      kind: SOL_DECISION
      description: "Calendar window: effective_date >= as_of_date - 365d."
      authority: "Phase 2A Sol §4"
    - id: ORACLE-SOL-OBV-VPT
      kind: SOL_DECISION
      description: "OBV change from OBV series; VPT change from VPT series. Separate source series."
      authority: "Phase 2A Sol §5"
    - id: ORACLE-SCHEMA-ACTIVE
      kind: CONTRACT
      description: "technical-active-output.schema.json"
    - id: ORACLE-SCHEMA-PROFILE
      kind: CONTRACT
      description: "technical-profile-output.schema.json"
    - id: ORACLE-REQ007-POLICY
      kind: CONTRACT
      description: "3-layer policy (lexical + semantic + imperative), negation-aware."
      authority: "Phase 2A contracts/REQ007-semantic-policy.yaml"
    - id: ORACLE-PRICE-BASIS
      kind: SOL_DECISION
      description: "3 bases: raw for provenance, adjusted for indicators/patterns, total-return for returns/beta. Fail-closed on UNKNOWN."
      authority: "Phase 2A Sol §2"
    - id: ORACLE-CLOSED-FORM-MA
      kind: CLOSED_FORM
      description: "Hand-computed SMA/EMA for small window (<=10) for calibration."
    - id: ORACLE-CLOSED-FORM-PERCENTILE
      kind: CLOSED_FORM
      description: "Hand-computed floor-counting percentile for a known input set."
    - id: ORACLE-BYTE-REPLAY
      kind: BYTE_IDENTICAL_REPLAY
      description: "Same fixture run twice; output hash must match."
    - id: ORACLE-PROPERTY-NO-LOOKAHEAD
      kind: PROPERTY_TEST
      description: "For 1000 random inputs, no detector references close[i+k] for k>0."
    - id: ORACLE-PROPERTY-PRECEDENCE
      kind: PROPERTY_TEST
      description: "For 1000 random inputs, exactly one archetype wins deterministically."
    - id: ORACLE-STATUS-TAXONOMY
      kind: SOL_DECISION
      description: "3-axis taxonomy: analysis_status + technical_state + confidence. BUY/SELL/HOLD banned."
      authority: "Phase 2A Sol §1"
    - id: ORACLE-MARKET-DATA-PACKET
      kind: CONTRACT
      description: "market-data-packet-v1.schema.json"
      authority: "Phase 2A Sol §6"

  # ==================================================================
