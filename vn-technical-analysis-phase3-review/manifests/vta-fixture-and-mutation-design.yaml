  # ==============================================================
  # Non-canonical witness registry (Phase 3 implementation review-R4)
  # --------------------------------------------------------------
  # Per OWNER REMEDIATION DIRECTIVE (R4) Section 3 (Witness rule):
  # these 7 records are NOT referenced by any canonical consumer and
  # are therefore NOT part of the canonical fixture / mutation
  # registries above. A "canonical consumer" means either a direct VC
  # mapping slot (positive/boundary/negative/mutation_fixture_ids in
  # vta-VC-to-verifier-mapping.yaml) OR an indirect reference via a
  # canonical mutation's required_fixture_id where that mutation is
  # itself referenced by a VC mapping slot. The 7 records below satisfy
  # neither path; they are retained here as documented witnesses so
  # their design rationale is preserved without polluting the canonical
  # orphan gate or the coverage denominators.
  #
  # Note: the directive's initial orphan list named 5 fixtures, but
  # FX-WRONG-SMOOTH-MUT-001 is in fact referenced indirectly via the
  # canonical mutation MUT-WRONG-SMOOTH (which VC-WRONG-SMOOTH-1
  # references), so it is NOT orphan and stays in the canonical fixture
  # block above as a documented mutation-host record.
  #
  # Witness semantics (uniform across all entries):
  #   counted_as_fixture_coverage: false
  #   counted_as_mutation_coverage: false
  #   subject_to_orphan_gate: false
  #
  # Each entry declares purpose, owner, and retention_rationale as
  # required by the directive.
  # ==============================================================
  noncanonical_witness_registry:
    counted_as_fixture_coverage: false
    counted_as_mutation_coverage: false
    subject_to_orphan_gate: false
    witness_count: 7
    composition:
      preserved_fixtures: 4
      negative_control_fixtures: 1
      mutation_witnesses: 2

    witnesses:

      # ---------- 4 preserved fixtures (registry-internal role, no canonical consumer) ----------
      # R4: FX-WRONG-SMOOTH-MUT-001 is NOT here — it stays in the canonical
      # fixture block because it is referenced by the canonical mutation
      # MUT-WRONG-SMOOTH, which is itself referenced by VC-WRONG-SMOOTH-1.
      # Only fixtures with NO canonical consumer at all are relocated here.

      - witness_id: FX-MODE-KERNEL-INT-001
        witness_kind: FIXTURE
        fixture_class: INTEGRATION
        target_VC_ids: ["VC-MODE-KERNEL-1", "VC-BOLL-2"]
        isolated_obligation: "ACTIVE BB and PROFILE BB helper produce IDENTICAL values for same input (shared kernel integrity)."
        frozen_inputs:
          - seed: "SEED-BOLL-SHARED"
            mode: "BOTH"
        expected_outputs:
          - active_bb_equal_profile_bb: true
            max_abs_diff: 0
        oracle_source: "ORACLE-TALIB-BOLL"
        determinism_expectation: "BYTE_IDENTICAL_REPLAY"
        purpose: "Redundant cross-mode INTEGRATION sweep; each of its two target VCs is already covered by a dedicated per-VC descriptive POSITIVE record."
        owner: "VTA Phase 3 fixture design"
        retention_rationale: "Redundant cross-mode integration sweep alongside FX-MODE-KERNEL-POS-IDENTICAL / FX-BOLL-2-POS-IDENTICAL."

      - witness_id: FX-VAL-BOUND-POS-001
        witness_kind: FIXTURE
        fixture_class: INTEGRATION
        target_VC_ids: ["VC-VAL-BOUND-1", "VC-VAL-BOUND-2"]
        isolated_obligation: "Integration adapter has NO write path to fundamental/valuation fields; schema rejects valuation_* keys in technical output."
        frozen_inputs:
          - seed: "SEED-INTEGRATION-ADAPTER"
            mode: "ACTIVE"
        expected_outputs:
          - write_path_to_valuation: false
            schema_rejects_valuation_keys: true
        oracle_source: "ORACLE-SCHEMA-ACTIVE"
        determinism_expectation: "BYTE_IDENTICAL_REPLAY"
        purpose: "Redundant valuation-bound INTEGRATION sweep; each target VC is already covered by a dedicated descriptive negative fixture."
        owner: "VTA Phase 3 fixture design"
        retention_rationale: "Redundant valuation-bound integration sweep alongside FX-VAL-BOUND-1-NEG-WRITE-PATH / FX-VAL-BOUND-2-NEG-VALUATION-KEY."

      - witness_id: FX-VAL-OVERRIDE-POS-001
        witness_kind: FIXTURE
        fixture_class: INTEGRATION
        target_VC_ids: ["VC-VAL-OVERRIDE-1"]
        isolated_obligation: "Integration adapter performs only technical-field writes; no write_target reaches any valuation_* field. No VALUATION_OVERRIDE_ATTEMPT fires. Positive-path witness for the negative-only valuation-modification detector."
        frozen_inputs:
          - seed: "SEED-INTEGRATION-ADAPTER"
            mode: "ACTIVE"
            attempt_write_target: null
        expected_outputs:
          - analysis_status: "OK"
            write_path_to_valuation: false
        oracle_source: "ORACLE-SCHEMA-ACTIVE"
        determinism_expectation: "BYTE_IDENTICAL_REPLAY"
        purpose: "Redundant positive witness for VC-VAL-OVERRIDE-1; the canonical POSITIVE record FX-VAL-OVERRIDE-POS-NO-WRITE-PATH already carries positive-path coverage."
        owner: "VTA Phase 3 fixture design"
        retention_rationale: "Redundant INTEGRATION positive witness alongside FX-VAL-OVERRIDE-POS-NO-WRITE-PATH."

      - witness_id: FX-ROUND-DRIFT-POS-001
        witness_kind: FIXTURE
        fixture_class: POSITIVE
        target_VC_ids: ["VC-ROUND-DRIFT-1"]
        isolated_obligation: "Same input run twice -> byte-identical output (no ROUNDING_DRIFT)."
        frozen_inputs:
          - seed: "SEED-ACTIVE-FULL-80w"
            mode: "ACTIVE"
        expected_outputs:
          - run1_hash_equal_run2_hash: true
        oracle_source: "ORACLE-BYTE-REPLAY"
        determinism_expectation: "BYTE_IDENTICAL_REPLAY"
        purpose: "Pre-registered POSITIVE for VC-ROUND-DRIFT-1, which is OUTSIDE the canonical 64-VC set. Kept for Phase 2B failure-mode-coverage-plan continuity; cannot contribute to canonical coverage."
        owner: "VTA Phase 3 fixture design"
        retention_rationale: "Pre-registration for an out-of-scope VC; bound by the Phase 2B failure-mode-coverage-plan."

      # ---------- 1 NEGATIVE_CONTROL fixture (reclassified from MUT-ADV-LANG-NEG) ----------

      - witness_id: FX-ADV-LANG-NEG-CONTROL
        witness_kind: FIXTURE
        fixture_class: NEGATIVE_CONTROL
        target_VC_ids: ["VC-REQ007-NEGATION"]
        isolated_obligation: "Output text contains 'not bullish' (negated, allowed). The negation-aware advice check must NOT fire. Expected behavior: NO_FAILURE."
        frozen_inputs:
          - text_fragment: "not bullish"
            advice_check_mode: "NEGATION_AWARE"
        expected_outputs:
          - advice_check_fired: false
        expected_primary_failure_code: null
        expected_behavior: NO_FAILURE
        oracle_source: "ORACLE-LANGUAGE-POLICY"
        determinism_expectation: "BYTE_IDENTICAL_REPLAY"
        included_in_mutation_denominator: false
        included_in_mutations_without_expected_code_check: false
        prior_identity: "MUT-ADV-LANG-NEG"
        reclassification: "RECLASSIFY_AS_NEGATIVE_CONTROL_FIXTURE (R4 directive Section 4)"
        purpose: "Negative-control witness: confirms the negation-aware advice-language check does NOT fire on the allowed phrase 'not bullish'. By design it must produce NO_FAILURE, so it cannot be a canonical mutation (canonical mutations must carry a non-null expected_failure_code)."
        owner: "VTA Phase 3 fixture design"
        retention_rationale: "Negative-control semantics are preserved here without violating the mutation contract; the canonical VC-REQ007-NEGATION positive path is already covered by FX-NEG-POS-NOT-BULLISH-ALLOWED."

      # ---------- 2 mutation witnesses ----------

      - witness_id: MUT-ROUND-DRIFT
        witness_kind: MUTATION
        target_VC_ids: ["VC-ROUND-DRIFT-1"]
        mutation_operator: NONDETERMINISTIC_ROUNDING
        mutated_behavior: "Rounding uses thread-local RNG tie-break (non-deterministic)."
        survivor_risk: LOW
        expected_failure_code: ROUNDING_DRIFT
        required_fixture_id: FX-ROUND-DRIFT-POS-001
        isolated_from_other_failures: true
        mandatory: OPTIONAL
        purpose: "Mutation witness bound to out-of-scope VC-ROUND-DRIFT-1 (outside the canonical 64). Its host fixture FX-ROUND-DRIFT-POS-001 is also a witness above; the canonical ROUNDING_DRIFT code is retained for this pre-registration."
        owner: "VTA Phase 3 fixture design"
        retention_rationale: "Pre-registered mutation for an out-of-scope VC; retained for Phase 2B failure-mode-coverage-plan continuity."

      - witness_id: MUT-BEAR-FALSE-POS
        witness_kind: MUTATION
        target_VC_ids: ["VC-COV-2"]
        mutation_operator: FIRE_BEARISH_ON_BULLISH_ONLY_INPUT
        mutated_behavior: "Bearish detector returns non-NOT_PRESENT on bullish-only input."
        survivor_risk: HIGH
        expected_failure_code: BEARISH_FALSE_POSITIVE
        required_fixture_id: FX-COV-2-NEG-BEARISH-FROM-ABSENCE
        isolated_from_other_failures: true
        purpose: "Mutation witness for VC-COV-2. VC-COV-2's canonical negative-path coverage is carried by the descriptive fixture FX-COV-2-NEG-BEARISH-FROM-ABSENCE, which is referenced directly in the VC mapping; this mutation is not slotted into the VC mapping and is therefore a non-canonical witness, not a coverage contributor."
        owner: "VTA Phase 3 fixture design"
        retention_rationale: "Design-phase guard for the bearish-from-absence detector; preserved for traceability while the canonical negative fixture carries coverage."

  # ==================================================================
  # Gate (load-bearing)
  # ==================================================================
  gate:
    canonical_VCs_with_positive_path: 64/64
    canonical_VCs_with_negative_or_mutation_path: 64/64
    fixtures_without_oracle_source: 0
    mutations_without_expected_code: 0
    non_isolated_mutations: 0
    isolation_contracts_satisfied:
      temporal_failures_isolated: true
      numerical_failures_isolated: true
      schema_failures_isolated: true
      provenance_failures_isolated: true
      setup_semantic_failures_isolated: true

  # ==================================================================
  # Integrity summary
  # ==================================================================
  integrity_check:
    fixture_count: 184       # canonical fixtures only (R4: 4 preserved fixtures moved to noncanonical_witness_registry; FX-WRONG-SMOOTH-MUT-001 retained as canonical mutation host)
    mutation_count: 33       # canonical mutations only (R4: 2 orphan mutations + 1 negative-control moved to noncanonical_witness_registry)
    mandatory_mutations: 24  # per failure-mode-coverage-plan: CRITICAL(5) + HIGH(13) + MEDIUM(8) - reconciliation = 24
    optional_mutations: 9    # LOW severity + bearish-design design-phase guards + design-gate threshold/denominator guards (negative-control removed in R4)
    fixture_class_distribution:
      POSITIVE: 65           # 65 descriptive per-VC POSITIVE records
      BOUNDARY: 49           # descriptive per-VC boundary fixtures
      NEGATIVE: 69           # descriptive per-VC negative fixtures
      MUTATION: 1            # FX-WRONG-SMOOTH-MUT-001 (canonical host for canonical mutation MUT-WRONG-SMOOTH)
      # R4: INTEGRATION (FX-MODE-KERNEL-INT-001, FX-VAL-BOUND-POS-001,
      # FX-VAL-OVERRIDE-POS-001) and out-of-scope POSITIVE (FX-ROUND-DRIFT-POS-001)
      # moved to noncanonical_witness_registry; they have no canonical consumer.
    VC_coverage:
      unique_VCs_with_fixture: 64
      unique_VCs_total: 64
      coverage_ratio: 64/64
    oracle_purity:
      fixtures_with_oracle: 184/184
      mutations_with_expected_code: 33/33   # R4: every canonical mutation carries a non-null expected_failure_code
      negative_control_mutations: 0         # R4: MUT-ADV-LANG-NEG reclassified to NEGATIVE_CONTROL witness fixture
    noncanonical_witness_accounting:
      witness_records: 7
      composition:
        preserved_fixtures: 4               # FX-MODE-KERNEL-INT-001, FX-VAL-BOUND-POS-001, FX-VAL-OVERRIDE-POS-001, FX-ROUND-DRIFT-POS-001
        negative_control_fixtures: 1        # FX-ADV-LANG-NEG-CONTROL (prior identity MUT-ADV-LANG-NEG)
        mutation_witnesses: 2               # MUT-ROUND-DRIFT, MUT-BEAR-FALSE-POS
      retained_as_canonical_mutation_host: 1  # FX-WRONG-SMOOTH-MUT-001 (referenced by canonical MUT-WRONG-SMOOTH)
      counted_as_fixture_coverage: false
      counted_as_mutation_coverage: false
      subject_to_orphan_gate: false
    canonical_inputs:
      verifier_obligation_matrix: "phase2B/manifests/verifier-obligation-matrix.yaml"
      failure_mode_coverage_plan: "phase2B/manifests/failure-mode-coverage-plan.yaml"
      failure_mode_registry: "phase1/manifests/technical-failure-mode-registry.yaml"
