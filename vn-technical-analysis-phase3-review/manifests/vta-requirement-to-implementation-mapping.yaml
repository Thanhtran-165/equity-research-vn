# VTA Phase 3 Implementation Review — Requirement → Implementation Mapping
# Per OWNER DIRECTIVE (Implementation Review deliverable)
#
# DESIGN ONLY — no implementation code.
# Maps each of the 15 VTA-REQs to its proposed implementation surface, contracts,
# linked verifier obligations, formula contracts, bearish setups, fixture classes,
# mutation classes, and implementation status.
#
# Canonical inputs:
#   - requirement-registry.yaml (15 VTA-REQs, frozen 2026-07-25)
#   - verifier-obligation-matrix.yaml (65 records → 64 unique after VC-FAB-VAL-1 MERGE)
#   - vta-vc-duplicate-resolution.yaml (MERGE_TRUE_DUPLICATES)
#   - vta-phase-3-implementation-scope.yaml (proposed module surfaces)

requirement_to_implementation_mapping:
  version: "1.0.0"
  frozen_at: "2026-07-28"
  phase: PHASE_3_IMPLEMENTATION_REVIEW
  artifact_class: DESIGN

  canonical_inputs:
    requirement_registry:
      path: vn-technical-analysis-phase2A/requirements/requirement-registry.yaml
      version: "1.0.0"
      frozen_at: "2026-07-25"
      total_requirements: 15
    verifier_obligation_matrix:
      path: vn-technical-analysis-phase2B/manifests/verifier-obligation-matrix.yaml
      version: "1.0.0"
      frozen_at: "2026-07-25"
      total_records: 65
      unique_records_after_merge: 64
    duplicate_resolution:
      path: vn-technical-analysis-phase3-readiness/manifests/vta-vc-duplicate-resolution.yaml
      resolution: MERGE_TRUE_DUPLICATES
      merged_id: VC-FAB-VAL-1
    implementation_scope:
      path: vn-technical-analysis-phase3-review/manifests/vta-phase-3-implementation-scope.yaml
      version: "1.0.0"

  authorization_boundary:
    implementation_code_authorized: false
    design_artifact_authorized: true
    note: >
      This artifact describes PROPOSED module surfaces and contracts only.
      No .py modules exist; implementation_status reflects current repository
      state per vta-requirement-inventory.yaml (14 NOT_IMPLEMENTED + 1 DESIGN_INPUT_READY).

  # ==================================================================
  # Requirements (15)
  # ==================================================================

  requirements:

    # ----------------------------------------------------------------
    # VTA-REQ-001 (HIGH, parent REQ-005)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-001
      canonical_name: "Technical ACTIVE mode produces valid output"
      parent_req: REQ-005
      category: TECHNICAL_ACTIVE
      controlled_risk: HIGH
      required_behavior: >
        Weekly OHLCV input → 6 indicators computed (MA, RSI, MACD, Bollinger,
        Beta, CMF) → tech_score binary aggregation → ACTIVE output packet
        satisfying technical-active-output.schema.json.
      prohibited_behavior:
        - "Output with insufficient weekly history (<52w)"
        - "Indicator computation error swallowed silently"
        - "Output missing any of the 6 indicators without fail-closed error_code"
        - "NaN propagation into required output fields"
      acceptance_criteria:
        - "weekly_history ≥ 52 baseline"
        - "All 6 indicators present or fail-closed with error_code"
        - "tech_score ∈ valid verdict band set (no gap at -3)"
        - "Output satisfies technical-active-output.schema.json"
        - "No lookahead bias (pattern at index i references only close[0..i])"
      proposed_modules:
        - implementation/indicator_engine.py
        - implementation/runner.py
        - implementation/output_assembler.py
      proposed_public_interfaces:
        - "run_active(ticker, weekly_data) → ActiveOutput"
        - "compute_rsi / compute_bollinger / compute_ma / compute_macd / compute_beta / compute_cmf"
        - "assemble_output(mode=ACTIVE, computed_results) → OutputPacket"
      proposed_input_contracts:
        - contracts/technical-common-input.schema.json
        - contracts/market-data-packet-v1.schema.json
      proposed_output_contracts:
        - contracts/technical-active-output.schema.json
        - contracts/status-taxonomy.yaml
      proposed_failure_modes:
        - INSUFFICIENT_HISTORY
        - EMPTY_SERIES
        - FORMULA_NOT_APPLICABLE
        - LOOKAHEAD_BIAS
      mapped_VC_ids:
        - VC-ACTIVE-VALID-1
        - VC-ACTIVE-VALID-2
        - VC-ACTIVE-VALID-3
        - VC-EMPTY-SERIES-1
        - VC-INHIST-1
        - VC-NAN-PROP-1
        - VC-BENCH-MISALIGN-1
        - VC-LOOKAHEAD-1
      formula_contract_ids:
        - F-MA
        - F-RSI
        - F-MACD
        - F-BOLLINGER
        - F-BETA
        - F-CMF
        - F-ALPHA
        - F-TECH-SCORE
      bearish_setup_ids: []
      fixture_classes:
        - ACTIVE_POSITIVE_VALID_52W
        - ACTIVE_NEGATIVE_EMPTY_SERIES
        - ACTIVE_NEGATIVE_INSUFFICIENT_HISTORY_51W
        - ACTIVE_BOUNDARY_EXACT_52W
        - ACTIVE_NEGATIVE_LOOKAHEAD_INJECTION
      mutation_classes:
        - MUT-INHIST-ACTIVE
        - MUT-EMPTY-SERIES
        - MUT-NAN-PROP
        - MUT-BENCH-MISALIGN
        - MUT-LOOKAHEAD
      implementation_status: MISSING
      unresolved_questions:
        - "Window set freeze (21/63/126/252 vs 20/60/120/252) — Phase 3 contract pending"
        - "MACD EMA seed convention (data[0] vs SMA) — Phase 3 contract pending"
        - "Beta window length + return basis + benchmark assignment — Phase 3 freeze pending"

    # ----------------------------------------------------------------
    # VTA-REQ-002 (HIGH, parent REQ-006)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-002
      canonical_name: "Technical PROFILE mode produces valid output"
      parent_req: REQ-006
      category: TECHNICAL_PROFILE
      controlled_risk: HIGH
      required_behavior: >
        Daily OHLCV input (≥60 sessions) → 17 PROFILE blocks + 8 bullish setups
        + 5 bearish setup designs (Phase 3 design, Phase 4 implementation) +
        archetype classification → PROFILE output satisfying
        technical-profile-output.schema.json.
      prohibited_behavior:
        - "Output with <60 daily sessions"
        - "Block computation error swallowed silently"
        - "17 blocks missing without explicit optional-skipped marker"
        - "setup_coverage_status == NOT_EVALUATED"
        - "Bearish setups derived by sign inversion of bullish"
      acceptance_criteria:
        - "daily_history ≥ 60 sessions enforced"
        - "17 blocks all present or marked optional-skipped"
        - "setup_coverage_status explicit (BULLISH_ONLY or INCOMPLETE_BEARISH_COVERAGE until Phase 4)"
        - "Archetype ∈ {A-TREND-FOLLOWING, A-ACCUMULATION-BREAKOUT, A-TRAP-PRONE, A-MIXED, A-NO-CURRENT-SETUP}"
        - "Output satisfies technical-profile-output.schema.json"
        - "Conflicting setups reported transparently, not silently dropped"
      proposed_modules:
        - implementation/profile_engine.py
        - implementation/indicator_engine.py
        - implementation/runner.py
        - implementation/output_assembler.py
      proposed_public_interfaces:
        - "run_profile(ticker, daily_data) → ProfileOutput"
        - "compute_profile_block(block_id, normalized_input) → BlockResult"
        - "detect_setup(setup_id, profile_context) → SetupResult"
        - "classify_archetype(profile_context) → ArchetypeResult"
      proposed_input_contracts:
        - contracts/technical-common-input.schema.json
        - contracts/market-data-packet-v1.schema.json
      proposed_output_contracts:
        - contracts/technical-profile-output.schema.json
        - contracts/bearish-setup-registry.yaml
        - contracts/archetype-precedence.yaml
      proposed_failure_modes:
        - INSUFFICIENT_HISTORY
        - EMPTY_SERIES
        - SCHEMA_VALIDATION_FAILED
        - CONFLICTING_SETUP_UNRESOLVED
        - BENCHMARK_UNAVAILABLE
      mapped_VC_ids:
        - VC-PROFILE-VALID-1
        - VC-PROFILE-VALID-2
        - VC-PROFILE-VALID-3
        - VC-PROFILE-VALID-4
        - VC-EMPTY-SERIES-1
        - VC-INHIST-1
        - VC-NAN-PROP-1
        - VC-BENCH-MISALIGN-1
        - VC-CONFLICT-SETUP-1
        - VC-UNCONFIRMED-1
        - VC-FALSE-BREAKOUT-1
        - VC-ARCH-AMBIG-1
      formula_contract_ids:
        - F-VPCI
        - F-VAR-ES
        - F-HVB
        - F-ROLLING-RETURN
        - F-PERCENTILE
        - F-REGIME
        - F-INDUSTRY-PEER
        - F-HV
        - F-DOUBLE-BOTTOM
        - F-ARCHETYPE-PRECEDENCE
      bearish_setup_ids:
        - C-BEAR-FLAG
        - C-BEAR-PENNANT
        - C-DESCENDING-TRIANGLE
        - C-RECTANGLE-TOP
        - C-HEAD-SHOULDERS
      fixture_classes:
        - PROFILE_POSITIVE_VALID_60D
        - PROFILE_NEGATIVE_INSUFFICIENT_HISTORY_59D
        - PROFILE_BOUNDARY_EXACT_60D
        - PROFILE_POSITIVE_17_BLOCKS_COMPLETE
        - PROFILE_POSITIVE_CONFLICTING_SETUPS
        - PROFILE_NEGATIVE_BENCHMARK_NONE
      mutation_classes:
        - MUT-INHIST-PROFILE
        - MUT-EMPTY-SERIES
        - MUT-NAN-PROP
        - MUT-CONFLICT-SETUP
        - MUT-UNCONFIRMED
        - MUT-ARCH-AMBIG
      implementation_status: MISSING
      unresolved_questions:
        - "Rolling-return window set freeze (21/63/126/252 vs 20/60/120/252) — Phase 3 pending"
        - "Percentile method freeze (floor vs linear) — Phase 3 pending"
        - "F-REGIME threshold calibration against VN market data — Phase 3 pending"
        - "F-INDUSTRY-PEER peer data source availability — Phase 3 pending"
        - "Bullish+bearish simultaneous match conflict-resolution option (A/B/C) — Phase 3 freeze pending"

    # ----------------------------------------------------------------
    # VTA-REQ-003 (HIGH, parent REQ-007, HIGHEST precedence)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-003
      canonical_name: "Non-advice language enforcement"
      parent_req: REQ-007
      category: LANGUAGE_POLICY
      controlled_risk: HIGH
      required_behavior: >
        All output text passes 3-layer non-advice check: lexical (regex tokens),
        semantic (implication rephrasing), imperative (mood detection), with
        negation-awareness (NOT bullish ≠ bullish).
      prohibited_behavior:
        - "Any prohibited token in output (bullish/bearish/tín hiệu/khuyến nghị/nên mua/nên bán/strong buy/strong sell/overbought/oversold)"
        - "Advice via semantic implication through different phrasing"
        - "Imperative mood (nên, phải, cần, hãy)"
        - "Flagging 'NOT bullish' as violation (negation-blind check)"
        - "BUY/SELL/HOLD verdict tokens"
      acceptance_criteria:
        - "Lexical scan: 0 prohibited tokens"
        - "Semantic scan: 0 advice implications"
        - "Imperative scan: 0 imperative constructions"
        - "Negation: 'not bullish' accepted (not flagged)"
        - "REQ-007 = HIGHEST precedence (overrides any other requirement)"
      proposed_modules:
        - implementation/language_verifier.py
      proposed_public_interfaces:
        - "check_language(output_text) → LanguageCheckResult"
      proposed_input_contracts:
        - contracts/REQ007-semantic-policy.yaml
      proposed_output_contracts:
        - contracts/status-taxonomy.yaml
      proposed_failure_modes:
        - ADVICE_LANGUAGE_DETECTED
      mapped_VC_ids:
        - VC-REQ007-LEXICAL
        - VC-REQ007-SEMANTIC
        - VC-REQ007-IMPERATIVE
        - VC-REQ007-NEGATION
        - VC-ADV-LANG-1
      formula_contract_ids:
        - F-STATUS-TAXONOMY
      bearish_setup_ids: []
      fixture_classes:
        - LANG_POSITIVE_CLEAN_TEXT
        - LANG_NEGATIVE_LEXICAL_TOKEN
        - LANG_NEGATIVE_SEMANTIC_ADVICE
        - LANG_NEGATIVE_IMPERATIVE
        - LANG_BOUNDARY_NEGATION_PHRASING
      mutation_classes:
        - MUT-ADV-LANG
        - MUT-ADV-LANG-NEG
      implementation_status: MISSING
      unresolved_questions:
        - "Semantic layer may require model-backed or curated-pattern implementation — Phase 4 implementation decision"
        - "Vietnamese negation token set completeness (chưa/phải không/không) — review at Phase 4 fixture freeze"

    # ----------------------------------------------------------------
    # VTA-REQ-004 (CRITICAL)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-004
      canonical_name: "Price basis selection per calculation type"
      category: PRICE_BASIS
      controlled_risk: CRITICAL
      required_behavior: >
        Indicators/patterns use adjusted_OHLCV. Returns/beta use
        total_return_adjusted_close. Raw OHLCV retained for provenance.
        Adjustment status field REQUIRED on every input; UNKNOWN or
        CONFLICTING → fail-closed.
      prohibited_behavior:
        - "Indicator computed on raw unadjusted close (creates false patterns from splits)"
        - "Return computed on adjusted close (drifts under corporate actions)"
        - "Adjustment status field absent"
        - "Adjustment status = UNKNOWN silently accepted"
        - "Adjustment status = CONFLICTING silently resolved"
      acceptance_criteria:
        - "Every indicator input tagged with price_basis ∈ {adjusted, total_return_adjusted}"
        - "Returns/beta use total_return_adjusted_close"
        - "Indicators/patterns use adjusted OHLCV"
        - "adjustment_status=UNKNOWN → error envelope, no output"
        - "adjustment_status=CONFLICTING → error envelope, no output"
      proposed_modules:
        - implementation/normalization_engine.py
      proposed_public_interfaces:
        - "normalize_input(raw_ohlcv, mode) → NormalizedInput"
        - "verify_price_basis(input, calculation_type) → PriceBasisResult"
      proposed_input_contracts:
        - contracts/technical-common-input.schema.json
        - contracts/price-basis-policy.yaml
        - contracts/market-data-packet-v1.schema.json
      proposed_output_contracts: []
      proposed_failure_modes:
        - UNKNOWN_ADJUSTMENT_STATUS
        - CONFLICTING_ADJUSTMENT_STATUS
      mapped_VC_ids:
        - VC-PRICE-BASIS-1
        - VC-PRICE-BASIS-2
        - VC-PRICE-BASIS-3
        - VC-CORP-ACT-1
      formula_contract_ids:
        - F-PRICE-BASIS
      bearish_setup_ids: []
      fixture_classes:
        - PRICE_POSITIVE_ADJUSTED_OK
        - PRICE_NEGATIVE_UNKNOWN_STATUS
        - PRICE_NEGATIVE_CONFLICTING_STATUS
        - PRICE_NEGATIVE_CORP_ACTION_SPLIT_DATE
        - PRICE_BOUNDARY_TOTAL_RETURN_VS_ADJUSTED
      mutation_classes:
        - MUT-CORP-ACT-UNADJ
      implementation_status: MISSING
      unresolved_questions:
        - "Collector extension to populate adjustment_status reliably — COLLECTOR_EXTENSION_PROGRAM before Phase 6"

    # ----------------------------------------------------------------
    # VTA-REQ-005 (HIGH)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-005
      canonical_name: "RSI uses Wilder smoothing"
      category: FORMULA_DEFINITION
      controlled_risk: HIGH
      required_behavior: >
        RSI computed with Wilder smoothing (period-1 multiplier on the SMMA
        of up/down moves), seeded per Wilder 1978 reference. Recalibrated
        against ta-lib Wilder RSI within 1e-6 tolerance.
      prohibited_behavior:
        - "Simple (equal-weighted) smoothing for RSI"
        - "EMA-based RSI without Wilder multiplier"
        - "Divergence from ta-lib Wilder RSI > 1e-6"
      acceptance_criteria:
        - "RSI computed with Wilder period-1 multiplier"
        - "Calibration against ta-lib Wilder RSI within 1e-6"
        - "Warmup policy explicitly defined (NaN or backfill or drop)"
        - "Rounding policy explicitly defined"
      proposed_modules:
        - implementation/indicator_engine.py
      proposed_public_interfaces:
        - "compute_rsi(close_series, period=14) → RSIResult"
      proposed_input_contracts:
        - contracts/technical-common-input.schema.json
      proposed_output_contracts:
        - contracts/formula-rsi.yaml
      proposed_failure_modes:
        - SMOOTHING_MISMATCH
        - INSUFFICIENT_HISTORY
      mapped_VC_ids:
        - VC-RSI-WILDER-1
        - VC-RSI-WILDER-2
        - VC-WRONG-SMOOTH-1
      formula_contract_ids:
        - F-RSI
      bearish_setup_ids: []
      fixture_classes:
        - RSI_POSITIVE_WILDER_CALIBRATION
        - RSI_NEGATIVE_SIMPLE_SMOOTHING_INJECTED
        - RSI_BOUNDARY_TA_LIB_1E6_TOLERANCE
      mutation_classes:
        - MUT-WRONG-SMOOTH
      implementation_status: MISSING
      unresolved_questions:
        - "Wilder seeding method (exact initialization) — Phase 3 contracts/formula-rsi.yaml pending"
        - "Warmup requirement (minimum bars before output valid) — Phase 3 pending"
        - "Rounding policy (decimal places) — Phase 3 pending"

    # ----------------------------------------------------------------
    # VTA-REQ-006 (HIGH)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-006
      canonical_name: "Bollinger uses consistent std convention"
      category: FORMULA_DEFINITION
      controlled_risk: HIGH
      required_behavior: >
        Shared Bollinger kernel uses ONE std convention (population ÷N OR
        sample ÷N-1). ACTIVE and PROFILE import from the SAME module.
        Both modes produce IDENTICAL BB values for identical input.
      prohibited_behavior:
        - "ACTIVE using population std while PROFILE uses sample std (mode-kernel divergence)"
        - "Per-mode std convention (FM-MODE-KERNEL-DIVERGENCE)"
        - "ACTIVE BB and PROFILE BB differing for identical input"
      acceptance_criteria:
        - "Single std convention frozen for shared kernel"
        - "ACTIVE BB == PROFILE BB for identical input"
        - "Convention documented in formula contract"
        - "Recommendation: OPTION_POPULATION (÷N) per Phase 3 input package"
      proposed_modules:
        - implementation/indicator_engine.py
      proposed_public_interfaces:
        - "compute_bollinger(close_series, window=20, multiplier=2) → BollingerResult"
      proposed_input_contracts:
        - contracts/technical-common-input.schema.json
      proposed_output_contracts:
        - contracts/formula-bollinger.yaml
      proposed_failure_modes:
        - MODE_KERNEL_DIVERGENCE
        - COMPUTATION_DEGENERATE
      mapped_VC_ids:
        - VC-BOLL-1
        - VC-BOLL-2
        - VC-MODE-KERNEL-1
      formula_contract_ids:
        - F-BOLLINGER
      bearish_setup_ids: []
      fixture_classes:
        - BOLL_POSITIVE_SHARED_KERNEL_IDENTICAL
        - BOLL_NEGATIVE_MODE_DIVERGENCE_INJECTED
        - BOLL_BOUNDARY_STD_ZERO_INPUT
      mutation_classes:
        - MUT-MODE-DIVERGE
      implementation_status: MISSING
      unresolved_questions:
        - "Std convention freeze (OPTION_POPULATION vs OPTION_SAMPLE) — Phase 3 HIGHEST-PRIORITY freeze pending"

    # ----------------------------------------------------------------
    # VTA-REQ-007 (MEDIUM)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-007
      canonical_name: "Channel slope normalized to percent per bar"
      category: FORMULA_DEFINITION
      controlled_risk: MEDIUM
      required_behavior: >
        normalized_slope_pct_per_bar = 100 × OLS_slope / median(close_window).
        Unit: percent per bar. Scale-free across price levels. Classification
        threshold frozen in Phase 3 contract.
      prohibited_behavior:
        - "Raw VND/bar slope (scale-dependent, breaks across price levels)"
        - "Non-OLS regression slope"
        - "Hardcoded 100 VND threshold"
      acceptance_criteria:
        - "Formula: normalized_slope_pct_per_bar = 100 × OLS_slope / median(close_window)"
        - "Scale-free: same %/bar for 10k and 100k price stocks"
        - "Classification threshold frozen in contracts/formula-channel-slope.yaml"
        - "Threshold Phase 3 frozen (currently T-CHANNEL-SLOPE pending)"
      proposed_modules:
        - implementation/profile_engine.py
        - implementation/indicator_engine.py
      proposed_public_interfaces:
        - "compute_channel_slope(close_window) → ChannelSlopeResult"
      proposed_input_contracts:
        - contracts/technical-common-input.schema.json
      proposed_output_contracts:
        - contracts/formula-channel-slope.yaml
      proposed_failure_modes:
        - FORMULA_NOT_APPLICABLE
      mapped_VC_ids:
        - VC-CHANNEL-1
        - VC-CHANNEL-2
      formula_contract_ids:
        - F-CHANNEL-SLOPE
      bearish_setup_ids: []
      fixture_classes:
        - CHANNEL_POSITIVE_NORMALIZED_SLOPE
        - CHANNEL_BOUNDARY_EXACT_THRESHOLD
        - CHANNEL_NEGATIVE_RAW_VND_SLOPE_INJECTED
      mutation_classes: []
      implementation_status: MISSING
      unresolved_questions:
        - "Classification threshold value freeze (|slope| > X%/bar → trending) — Phase 3 contracts/formula-channel-slope.yaml pending"

    # ----------------------------------------------------------------
    # VTA-REQ-008 (CRITICAL)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-008
      canonical_name: "No mode contamination in output"
      category: MODE_SEPARATION
      controlled_risk: CRITICAL
      required_behavior: >
        ACTIVE output contains no PROFILE-only fields (profile_blocks,
        archetype, setups). PROFILE output contains no ACTIVE-only fields
        (tech_score, 6_binary_signals). Schema enforces additionalProperties: false.
      prohibited_behavior:
        - "ACTIVE output containing profile_blocks key"
        - "PROFILE output containing tech_score / 6_binary_signals"
        - "Schema accepts foreign keys (additionalProperties: true)"
        - "Cross-mode field injection"
      acceptance_criteria:
        - "ACTIVE output rejects profile_blocks"
        - "PROFILE output rejects tech_score / 6_binary_signals"
        - "Schema validation rejects foreign keys (additionalProperties: false)"
        - "ACTIVE BB == PROFILE BB for identical input (shared kernel)"
      proposed_modules:
        - implementation/output_assembler.py
      proposed_public_interfaces:
        - "assemble_output(mode, computed_results) → OutputPacket"
        - "validate_schema(output_packet, schema) → ValidationResult"
      proposed_input_contracts: []
      proposed_output_contracts:
        - contracts/technical-active-output.schema.json
        - contracts/technical-profile-output.schema.json
      proposed_failure_modes:
        - MODE_CONTAMINATION
        - SCHEMA_VALIDATION_FAILED
      mapped_VC_ids:
        - VC-MODE-SEP-1
        - VC-MODE-SEP-2
        - VC-MODE-SEP-3
        - VC-MODE-CONTAM-1
        - VC-MODE-KERNEL-1
      formula_contract_ids: []
      bearish_setup_ids: []
      fixture_classes:
        - MODE_SEP_POSITIVE_CLEAN_ACTIVE
        - MODE_SEP_POSITIVE_CLEAN_PROFILE
        - MODE_SEP_NEGATIVE_ACTIVE_WITH_PROFILE_BLOCKS
        - MODE_SEP_NEGATIVE_PROFILE_WITH_TECH_SCORE
        - MODE_SEP_NEGATIVE_FOREIGN_KEY
      mutation_classes:
        - MUT-MODE-CONTAM
        - MUT-SCHEMA-DRIFT
      implementation_status: MISSING
      unresolved_questions: []

    # ----------------------------------------------------------------
    # VTA-REQ-009 (MEDIUM)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-009
      canonical_name: "Setup coverage honestly reported"
      category: SETUP_COVERAGE
      controlled_risk: MEDIUM
      required_behavior: >
        setup_coverage_status field discloses directional coverage status:
        BULLISH_ONLY or INCOMPLETE_BEARISH_COVERAGE (before Phase 4 bearish
        implementation). NOT_EVALUATED prohibited. Absence of bullish setup
        MUST NOT be reported as bearish evidence.
      prohibited_behavior:
        - "setup_coverage_status = NOT_EVALUATED after Phase 4"
        - "Coverage claim implying completeness when bearish detectors not implemented"
        - "Inferring bearish from absence of bullish setup"
        - "Implicit directional completeness"
      acceptance_criteria:
        - "setup_coverage_status ∈ {BULLISH_ONLY, INCOMPLETE_BEARISH_COVERAGE, COMPLETE_DIRECTIONAL_COVERAGE}"
        - "Before Phase 4 bearish implementation: status = INCOMPLETE_BEARISH_COVERAGE"
        - "Absence of bullish setup ≠ bearish evidence"
        - "After Phase 4 mutation pass: status may upgrade to COMPLETE_DIRECTIONAL_COVERAGE"
      proposed_modules:
        - implementation/profile_engine.py
        - implementation/output_assembler.py
      proposed_public_interfaces:
        - "compute_setup_coverage(setup_results) → CoverageStatus"
      proposed_input_contracts: []
      proposed_output_contracts:
        - contracts/technical-profile-output.schema.json
      proposed_failure_modes:
        - SETUP_COVERAGE_MISREPRESENTED
      mapped_VC_ids:
        - VC-COV-1
        - VC-COV-2
        - VC-PROFILE-VALID-4
      formula_contract_ids: []
      bearish_setup_ids: []
      fixture_classes:
        - COV_POSITIVE_BULLISH_ONLY_HONEST
        - COV_POSITIVE_INCOMPLETE_BEARISH
        - COV_NEGATIVE_BEARISH_FROM_ABSENCE
        - COV_NEGATIVE_NOT_EVALUATED
      mutation_classes: []
      implementation_status: MISSING
      unresolved_questions:
        - "Coverage status trajectory: BULLISH_ONLY → INCOMPLETE_BEARISH_COVERAGE → COMPLETE_DIRECTIONAL_COVERAGE gated by Phase 4Q mutations"

    # ----------------------------------------------------------------
    # VTA-REQ-009a (HIGH — Phase 3 design obligation)
    # ----------------------------------------------------------------
    - requirement_id: VTA-REQ-009a
