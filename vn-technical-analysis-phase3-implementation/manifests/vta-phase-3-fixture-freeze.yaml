oracle_source_catalog:
- id: ORACLE-BYTE-REPLAY
  kind: BYTE_IDENTICAL_REPLAY
  description: Same fixture run twice; output hash must match.
- id: ORACLE-CLOSED-FORM-MA
  kind: CLOSED_FORM
  description: Hand-computed SMA/EMA for small window (<=10) for calibration.
- id: ORACLE-CLOSED-FORM-PERCENTILE
  kind: CLOSED_FORM
  description: Hand-computed floor-counting percentile for a known input set.
- id: ORACLE-MARKET-DATA-PACKET
  kind: CONTRACT
  description: market-data-packet-v1.schema.json
- id: ORACLE-PRICE-BASIS
  kind: SOL_DECISION
  description: '3 bases: raw for provenance, adjusted for indicators/patterns, total-return for returns/beta. Fail-closed on UNKNOWN.'
- id: ORACLE-PROPERTY-NO-LOOKAHEAD
  kind: PROPERTY_TEST
  description: For 1000 random inputs, no detector references close[i+k] for k>0.
- id: ORACLE-PROPERTY-PRECEDENCE
  kind: PROPERTY_TEST
  description: For 1000 random inputs, exactly one archetype wins deterministically.
- id: ORACLE-REQ007-POLICY
  kind: CONTRACT
  description: 3-layer policy (lexical + semantic + imperative), negation-aware.
- id: ORACLE-SCHEMA-ACTIVE
  kind: CONTRACT
  description: technical-active-output.schema.json
- id: ORACLE-SCHEMA-PROFILE
  kind: CONTRACT
  description: technical-profile-output.schema.json
- id: ORACLE-SOL-CHANNEL-SLOPE
  kind: SOL_DECISION
  description: Sol §3 normalized_slope_pct_per_bar = 100 x OLS_slope / median(close_window).
- id: ORACLE-SOL-EVENTS-1Y
  kind: SOL_DECISION
  description: 'Calendar window: effective_date >= as_of_date - 365d.'
- id: ORACLE-SOL-OBV-VPT
  kind: SOL_DECISION
  description: OBV change from OBV series; VPT change from VPT series. Separate source series.
- id: ORACLE-STATUS-TAXONOMY
  kind: SOL_DECISION
  description: '3-axis taxonomy: analysis_status + technical_state + confidence. BUY/SELL/HOLD banned.'
- id: ORACLE-TALIB-BOLL
  kind: REFERENCE_LIBRARY
  description: ta-lib Bollinger Bands with frozen std convention.
- id: ORACLE-TALIB-WILDER
  kind: REFERENCE_LIBRARY
  description: ta-lib RSI Wilder implementation. Tolerance 1e-6.
