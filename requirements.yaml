requirements:
- id: REQ-001
  text: Sponsor package phải hoạt động (tier golden). KHÔNG fallback community tier.
  type: mandatory
  priority: critical
  failure_mode: FM-06
  case_ref: LC-006
  verification:
    method: command
    command: python3 -c "from vnstock_data import Finance; print('OK')" 2>/dev/null
      | grep -q OK
    expect_exit: 0
  fix_hint: pip3 install 'vnstock==3.5.1' --break-system-packages
- id: REQ-002
  text: Sponsor data phải trả ≥20 kỳ (không phải community 8 kỳ).
  type: mandatory
  priority: critical
  failure_mode: FM-02
  case_ref: LC-006
  verification:
    method: command
    command: python3 -c "import warnings; warnings.filterwarnings('ignore'); from
      vnstock_data import Finance; f=Finance(symbol='$TICKER',source='VCI'); print(len(f.income_statement()))"
      2>/dev/null | grep -E '^[0-9]+$' | tail -1
    expect_min: 20
  fix_hint: 'Downgrade vnstock: pip3 install ''vnstock==3.5.1'''
- id: REQ-003
  text: Audit split (Bẫy 5B) trước khi tính EPS/PE/PB. Back-calc CP = LNST/EPS từng
    năm.
  type: mandatory
  priority: high
  failure_mode: FM-08
  verification:
    method: artifact_check
    check: Report phải mention 'split-adjusted' hoặc 'Bẫy 5B' hoặc 'cross-check EPS'
- id: REQ-004
  text: Data giá THẬT từ vnstock. KHÔNG mô phỏng/ngụy tạo data giá.
  type: mandatory
  priority: critical
  failure_mode: FM-08
  verification:
    method: artifact_check
    check: Chart data values phải khớp vnstock (không placeholder, không Oracle/HPG)
- id: REQ-005
  text: Technical mode ACTIVE (weekly 52 tuần, Tech Score -6→+6, Verdict, MA/RSI/MACD).
  type: mandatory
  priority: high
  failure_mode: FM-01
  verification:
    method: artifact_check
    check: Report phải có sec-tech với Tech Score số + Verdict (STRONG SELL→STRONG
      BUY)
- id: REQ-006
  text: Technical mode PROFILE (daily ~2 năm, 15 block, archetype, NON-ADVICE).
  type: mandatory
  priority: high
  failure_mode: FM-01
  verification:
    method: artifact_check
    check: Report phải có sec-tech-profile, KHÔNG chứa 'bullish|bearish|khuyến nghị
      mua|strong buy|strong sell'
- id: REQ-007
  text: Section PROFILE phải dùng ngôn ngữ neutral_descriptive_non_advice.
  type: mandatory
  priority: high
  failure_mode: FM-03
  verification:
    method: artifact_check
    check: 'Section PROFILE phải dùng ngôn ngữ neutral_descriptive_non_advice (P4:
      negation-aware)'
- id: REQ-008
  text: News digest 30 ngày với sentiment score + category breakdown.
  type: mandatory
  priority: medium
  failure_mode: FM-02
  verification:
    method: artifact_check
    check: Report phải có sentiment score (số) + ít nhất 2 category
- id: REQ-009
  text: Dashboard copy từ dashboard_template.html (22 sections canonical). KHÔNG tự
    chế section ids.
  type: mandatory
  priority: critical
  failure_mode: FM-06
  case_ref: LC-001, LC-002
  verification:
    method: section_map_check
    canonical_sections:
    - sec-hero
    - sec-exec
    - sec-biz
    - sec-industry
    - sec-history
    - sec-segment
    - sec-thesis
    - sec-valuation
    - sec-peer
    - sec-bs
    - sec-risk
    - sec-33k
    - sec-scenario
    - sec-checklist
    - sec-insight-1
    - sec-insight-2
    - sec-insight-3
    - sec-tech
    - sec-tech-profile
    - sec-analyst
    - sec-glossary
    - sec-source
    min_canonical_match: 20
    required_signal_sections:
    - sec-hero
    - sec-exec
    - sec-valuation
- id: REQ-010
  text: Tất cả tokens {{...}} phải được replace. Không token rỗng.
  type: mandatory
  priority: high
  failure_mode: FM-02
  verification:
    method: command
    command: grep -oE '\{\{[A-Z_0-9]+\}\}' $REPORT | wc -l | tr -d ' '
    expect_max: 0
- id: REQ-011
  text: Canvas elements phải có height-wrapper (chặn Chart.js feedback loop giãn vô
    hạn).
  type: mandatory
  priority: high
  failure_mode: FM-02
  case_ref: LC-004
  verification:
    method: canvas_check
    check: Mỗi <canvas> phải có parent với class chart-wrap/tech-chart-wrap hoặc style
      height
- id: REQ-012
  text: Charts ≥10, Sections ≥20, Refs ≥10.
  type: mandatory
  priority: high
  failure_mode: FM-02
  verification:
    method: count_check
    min_charts: 10
    min_sections: 20
    min_refs: 10
- id: REQ-013
  text: Mỗi section phải có content depth ≥200 chars (không rỗng/mỏng).
  type: mandatory
  priority: high
  failure_mode: FM-02
  verification:
    method: content_depth_check
    min_chars_per_section: 200
    exempt_sections:
    - sec-hero
- id: REQ-014
  text: 3 Special Insights riêng biệt (sec-insight-1/2/3), mỗi cái ≥500 chars.
  type: mandatory
  priority: high
  failure_mode: FM-01
  verification:
    method: section_content_check
    sections:
    - sec-insight-1
    - sec-insight-2
    - sec-insight-3
    min_chars_each: 500
- id: REQ-015
  text: Bull + Bear case cân bằng (không chỉ bullish).
  type: mandatory
  priority: high
  failure_mode: FM-03
  verification:
    method: artifact_check
    check: Section risk phải có content (không rỗng)
- id: REQ-016
  text: Valuation targets phải hợp lý (dương, không âm vô lý). DCF với FCF<0 phải
    flag + dùng alternative.
  type: mandatory
  priority: high
  failure_mode: FM-05
  case_ref: LC-005
  verification:
    method: valuation_sanity_check
    check: val-card prices phải dương. Nếu FCF<0 → phải có note giải thích
- id: REQ-017
  text: Flag honest về data limitation (ước tính, stale, community tier).
  type: mandatory
  priority: medium
  failure_mode: FM-05
  verification:
    method: artifact_check
    check: Report phải chứa ít nhất 1 'callout' với 'ước tính|limitation|stale|honest'
- id: REQ-018
  text: Sources & references ≥10 numbered citations.
  type: mandatory
  priority: medium
  failure_mode: FM-02
  verification:
    method: command
    command: grep -oE 'id="ref-[0-9]+"' $REPORT | wc -l | tr -d ' '
    expect_min: 10
- id: REQ-019
  text: JS syntax hợp lệ (node --check pass).
  type: mandatory
  priority: high
  failure_mode: FM-10
  verification:
    method: command
    command: node --check $JS_FILE
    expect_exit: 0
- id: REQ-020
  text: Div balance (open = close).
  type: mandatory
  priority: high
  failure_mode: FM-10
  verification:
    method: div_balance_check
- id: REQ-022
  text: Revenue/NPATMI/EPS trong report KHỚP data files (±5%). KHÔNG bịa.
  type: mandatory
  priority: critical
  failure_mode: FM-05
  case_ref: LC-v2-fabrication
  verification:
    method: data_accuracy_check
    data_file: data/financials.json
    fields:
    - key: revenue_ty
      years:
      - 2021
      - 2022
      - 2023
      - 2024
      - 2025
      divisor: 1
      tolerance_pct: 5
    - key: npatmi_ty
      years:
      - 2021
      - 2022
      - 2023
      - 2024
      - 2025
      divisor: 1
      tolerance_pct: 5
    - key: eps_vnd
      years:
      - 2025
      divisor: 1
      tolerance_pct: 5
- id: REQ-023
  text: Balance sheet metrics (Total Assets, Equity) khớp balance_sheet.json (±5%).
  type: mandatory
  priority: critical
  failure_mode: FM-05
  verification:
    method: data_accuracy_check
    data_file: data/balance_sheet.json
    fields:
    - key: Total Assets
      years:
      - '2025'
      divisor: 1000000000
      tolerance_pct: 5
    - key: Owner's Equity
      years:
      - '2025'
      divisor: 1000000000
      tolerance_pct: 5
- id: REQ-024
  text: Capex trong chart/report KHỚP cash_flow.json 'Purchases of fixed assets'.
    KHÔNG bịa capex array.
  type: mandatory
  priority: critical
  failure_mode: FM-05
  case_ref: LC-v2-fabrication-capex
  verification:
    method: capex_accuracy_check
    data_file: data/cash_flow.json
    capex_key: Purchases of fixed assets and other long term assets
    report_chart_var: capex
    tolerance_pct: 10
- id: REQ-025
  text: Valuation multiples (PE, PB, Graham) recomputed từ data == report values (±2%).
  type: mandatory
  priority: high
  failure_mode: FM-05
  verification:
    method: valuation_recompute_check
    formulas:
    - name: PE
      formula: price / eps_2025
      report_extract: P/E.*?([\d.]+)x
      tolerance_pct: 2
    - name: PB
      formula: price / (equity / shares)
      report_extract: P/B.*?([\d.]+)x
      tolerance_pct: 2
- id: REQ-026
  text: Chart DATA JS object chứa values KHỚP data files (revenue, npatmi arrays).
  type: mandatory
  priority: high
  failure_mode: FM-05
  verification:
    method: chart_data_accuracy_check
    data_file: data/financials.json
    js_var: DATA
    check_arrays:
    - revenue
    - netProfit
    - eps
- id: REQ-027
  text: Số liệuexternal (WCM LN, MCH DT, store count) phải flag 'ước tính' nếu không
    có data file.
  type: mandatory
  priority: medium
  failure_mode: FM-05
  verification:
    method: external_claim_flag_check
    patterns:
    - WCM.*LN.*\d
    - MCH.*DT.*\d
    - \d+\s*điểm bán
    must_flag: ước tính|estimate|external|marketing
- id: REQ-028
  text: 'Chart render-readiness: mỗi canvas ID referenced trong Chart() phải có HTML
    element, không duplicate, có DATA object. (Học từ PNJ v2 test: 27/27 PASS nhưng
    charts vẫn crash do duplicate canvas sau </body>.)'
  type: mandatory
  priority: high
  failure_mode: FM-08
  case_ref: PNJ-v2-test
  verification:
    method: chart_runtime_check
- id: REQ-029
  text: 'Source citation: mọi số liệu định lượng trong narrative (revenue, profit, %, multiples, drawdown) phải có nguồn cite. Key metrics (PE, PB, CAGR) cite source ít nhất 1 lần khi xuất hiện đầu. KHÔNG có số liệu "trôi nổi" không nguồn — nếu không có source, phải ghi "ước tính" hoặc bỏ. (Lesson Learned #7-10: agent đưa %, multiples, drawdown không cite nguồn.)'
  type: mandatory
  priority: high
  failure_mode: FM-05
  case_ref: CTD-live-demo
  verification:
    method: source_citation_check
    rules:
      - 'Mỗi số VND/ty/%/x trong narrative: check có source keyword gần (BCTC, vnstock, data, ref-) HOẶC marker "ước tính/giả định"'
      - 'Key metrics (PE, PB, CAGR, ROE): cite source ít nhất 1 lần trong section đầu xuất hiện'
      - 'Drawdown/risk claims: phải cite data thật (max drawdown từ price history) HOẶC ghi "ước tính dựa trên"'
      - 'Percentages >0 và <100: phải có context/source, KHÔNG trôi nổi'
    exempt:
      - 'Số trong CSS/style (width, height, font-size)'
      - 'Số trong timestamp/date'
      - 'Số section ID (sec-1, sec-2)'
- id: REQ-030
  text: 'Price freshness: giá hiện tại phải fetch real-time từ API, KHÔNG tự điền tay. Nếu API giá down → ghi "giá tại thời điểm fetch" + timestamp. (Lesson Learned #6: price=62000 tự điền, có thể sai.)'
  type: mandatory
  priority: critical
  failure_mode: FM-05
  case_ref: CTD-live-demo
  verification:
    method: price_source_check
    rules:
      - 'Price trong overview.json phải có source: API hoặc verified-dashboard-data.json'
      - 'KHÔNG cho phép user/agent tự điền price'
      - 'Nếu API down → price field = null + FAIL với lý do "price unavailable"'
- id: REQ-031
  text: 'Drawdown verification: mọi claim về drawdown (%) hoặc rủi ro giá phải dựa trên data giá thật (max drawdown từ price history 52 tuần). KHÔNG ước tính từ bộ nhớ. (Lesson Learned #9: "30-50% drawdown" không có data.)'
  type: mandatory
  priority: high
  failure_mode: FM-05
  case_ref: CTD-live-demo
  verification:
    method: drawdown_source_check
    rules:
      - 'Nếu claim "drawdown X%" → check có max_drawdown trong verified-dashboard-data.json'
      - 'Nếu KHÔNG có data drawdown → claim phải ghi "chưa có data, ước tính dựa trên ngành"'
      - 'KHÔNG được ghi số cụ thể (%) nếu không có source'
- id: REQ-032
  text: 'Peer provenance: mọi số liệu peer trong narrative (tên DN cùng ngành + giá trị so sánh) phải lấy từ peers.json HOẶC verified-dashboard-data.json. KHÔNG bịa peer data từ bộ nhớ. (Lesson Learned #4: agent bịa "peer" data.)'
  type: mandatory
  priority: critical
  failure_mode: FM-05
  case_ref: CTD-live-demo
  verification:
    method: peer_provenance_check
    rules:
      - 'Nếu narrative mention peer company + số liệu (PE, PB, revenue, market cap) → phải có peers.json hoặc peer section trong verified-dashboard-data.json'
      - 'Nếu KHÔNG có peer data file → peer comparison section phải ghi "chưa có data peer" thay vì số cụ thể'
      - 'Peer values trong report phải khớp peer data (±10%)'
- id: REQ-033
  text: 'Cross-section consistency: cùng 1 số liệu key (revenue, NPAT, EPS, PE, PB, CAGR, market cap) xuất hiện ở nhiều section phải KHỚP nhau (±5%). Section exec summary vs section detail không được mâu thuẫn. (Review agent: đây là gap lớn nhất — cùng con số nhưng mỗi section 1 giá trị.)'
  type: mandatory
  priority: critical
  failure_mode: FM-05
  case_ref: review-agent-v2
  verification:
    method: cross_section_consistency_check
    rules:
      - 'Extract tất cả số liệu key từ mọi section'
      - 'Nếu 2 section cùng mention 1 metric với giá trị lệch >5% → FAIL'
      - 'sec-exec phải là "single source of truth": nếu sec-exec khác section detail → FAIL'
- id: REQ-034
  text: 'Temporal alignment: số liệu theo năm phải khớp đúng năm. Revenue/npatmi 2024 không được gắn nhãn 2025. Period labels (FY2021-FY2025) phải khớp data files. CAGR phải tính từ đúng khoảng năm được tuyên bố. (Review agent: agent trộn năm khi narrative.)'
  type: mandatory
  priority: critical
  failure_mode: FM-05
  case_ref: review-agent-v2
  verification:
    method: temporal_alignment_check
    rules:
      - 'Mỗi số liệu theo năm trong narrative phải khớp data file của năm đó (không lệch năm)'
      - 'Chart x-axis labels phải khớp years array trong data'
      - 'Nếu claim "tăng trưởng từ 2021-2025" → CAGR phải tính từ 2021 baseline, không phải 2022'
- id: REQ-035
  text: 'Segment data: mọi segment breakdown (doanh thu theo mảng, % contribution) phải có nguồn (segments.json / company_profile.json / data files). KHÔNG bịa segment ratio. (Review agent: segment split là nơi agent hay bịa nhất.)'
  type: mandatory
  priority: high
  failure_mode: FM-05
  case_ref: review-agent-v2
  verification:
    method: segment_check
    rules:
      - 'Nếu narrative có segment revenue/contribution % → phải có nguồn data'
      - 'Nếu không có data → phải ghi "ước tính" hoặc bỏ'
- id: REQ-036
  text: 'CAGR recompute: mọi claim CAGR (%) phải recompute được từ data files (financials.json) ±2%. KHÔNG bịa CAGR. (Review agent: keyword-check lách được; phải recompute thật.)'
  type: mandatory
  priority: high
  failure_mode: FM-05
  case_ref: review-agent-v2
  verification:
    method: cagr_recompute_check
    data_file: data/financials.json
    fields: [revenue_ty, npatmi_ty]
    tolerance_pct: 2
- id: REQ-037
  text: 'Technical recompute: Tech Score + Verdict phải recompute được từ price data (weekly 52 tuần) HOẶC technical_active.json. KHÔNG bịa tech score. (Review agent: tech score là claim định lượng phải có nguồn tính toán.)'
  type: mandatory
  priority: high
  failure_mode: FM-05
  case_ref: review-agent-v2
  verification:
    method: tech_recompute_check
    rules:
      - 'Tech score trong report phải khớp technical_active.json / verified-dashboard-data.json.technical (±2)'
      - 'Verdict phải tương ứng scale: score âm → SELL side, score dương → BUY side'
      - 'Nếu không có tech data file → FAIL (thiếu nguồn)'
- id: REQ-038
  text: 'Claim basis: mọi claim so sánh/đánh giá (tăng trưởng nhanh nhất, dẫn đầu, cao nhất ngành, tốt hơn peer) phải có basis cụ thể (số liệu, data file, hoặc nguồn). Claims không có basis → phải ghi "theo đánh giá" hoặc bỏ. (Review agent: agent claim "leading" không data.)'
  type: mandatory
  priority: high
  failure_mode: FM-05
  case_ref: review-agent-v2
  verification:
    method: claim_basis_check
    rules:
      - 'Superlative claims (dẫn đầu, nhất, lớn nhất, top) phải có số liệu hỗ trợ trong ±200 chars'
      - 'So sánh với peer phải có peer data trong ±200 chars'
      - 'Nếu không có basis → FAIL'
- id: REQ-039
  text: 'Industry claim: mọi claim về ngành (thị phần ngành, tốc độ tăng trưởng ngành, quy mô thị trường) phải cite nguồn (báo cáo ngành, công bố, ước tính). KHÔNG bịa thị phần ngành. (Review agent: industry figure hay bịa.)'
  type: mandatory
  priority: high
  failure_mode: FM-05
  case_ref: review-agent-v2
  verification:
    method: industry_claim_check
    rules:
      - 'Industry %/size claims phải có nguồn keyword (báo cáo, công bố, ước tính, theo, nghiên cứu)'
      - 'Nếu không có nguồn → FAIL'
- id: REQ-040
  text: 'Identity: ticker + company name trong report phải khớp target (CTD=Coteccons). KHÔNG nhầm ticker khác (Oracle, HPG...). (REQ-004 cũ: chart data trộn Oracle/HPG.)'
  type: mandatory
  priority: medium
  failure_mode: FM-08
  case_ref: CTD-live-demo
  verification:
    method: identity_check
    rules:
      - 'Report title/hero phải có đúng ticker + company name'
      - 'KHÔNG được mention ticker khác (trừ peer section có nguồn)'
- id: REQ-041
  text: 'News window: news digest phải fetch trong 30 ngày gần nhất, KHÔNG dùng news cũ/không date. (Review agent: news 3 tháng trước vẫn được đưa vào.)'
  type: mandatory
  priority: medium
  failure_mode: FM-02
  case_ref: review-agent-v2
  verification:
    method: news_window_check
    rules:
      - 'news_digest.json articles phải có date trong 30 ngày'
      - 'Nếu article date >30 ngày hoặc không có date → FAIL'
- id: REQ-042
  text: 'Investment amount: investment_amount từ task-state phải được dùng trong scenario/insight (3 mức: 100tr/500tr/1 tỷ). KHÔNG hardcode mức đầu tư khác. (Lesson Learned #3: agent hardcode investment.)'
  type: mandatory
  priority: medium
  failure_mode: FM-05
  case_ref: CTD-live-demo
  verification:
    method: investment_amount_check
    rules:
      - 'investment_amount trong task-state.json phải xuất hiện trong narrative (sec-scenario/insight)'
      - 'Nếu không có investment_amount → PASS với note "no amount set"'
      - 'Số tiền nhắc trong narrative phải khớp task-state (±10%)'
- id: REQ-043
  text: 'Source freshness: references phải có date (ngày truy cập/năm), không "stale" quá 24 tháng so với ngày report. (Review agent: source date rỗng.)'
  type: mandatory
  priority: medium
  failure_mode: FM-05
  case_ref: review-agent-v2
  verification:
    method: source_freshness_check
    rules:
      - 'Mỗi ref phải có năm (20xx) hoặc date'
      - 'Nếu ref date rỗng → FAIL (trừ "standard" sources như BCTC, filings)'
- id: REQ-021
  text: KHÔNG deploy nếu bất kỳ REQ nào FAIL. Hook PreToolUse chặn vercel deploy.
  type: mandatory
  priority: critical
  failure_mode: FM-05
  verification:
    method: all_requirements_pass
